<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
</helmet>
<section style="display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: var(--font-sans); color: var(--ink); font-size: 14px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;">
    <sc-for list="{{ letters }}" as="l" hint-placeholder-count="27"><button onClick="{{ l.onClick }}" style="font: inherit; font-size: 13px; min-width: 32px; height: 32px; padding: 0 6px; white-space: nowrap; border: 1px solid var(--ink); background: {{ l.bg }}; color: {{ l.fg }}; cursor: pointer;">{{ l.label }}</button></sc-for>
  </div>
  <sc-if value="{{ hasChips }}">
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 960px;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6"><a href="{{ c.href }}" style="font-size: 12px; padding: 4px 10px; border: 1px solid var(--neutral-300);" style-hover="background: var(--ink); color: var(--paper); border-color: var(--ink);">{{ c.code }}</a></sc-for>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:120},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Chart&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.UFT, sel: '' };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const page = this.props.page || 'Chart'; const sel = this.state.sel;
    const L = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', '1…9'];
    const letters = L.map(l => ({ label: l, bg: sel === l ? 'var(--ink)' : 'var(--paper)', fg: sel === l ? 'var(--paper)' : 'var(--ink)', onClick: () => this.setState({ sel: sel === l ? '' : l }) }));
    const match = c => sel === '1…9' ? /^\d/.test(c) : c.startsWith(sel);
    const chips = sel ? U.symbols.filter(match).map(code => ({ code, href: U.href(page, { symbol: code }) })) : [];
    return { letters, chips, hasChips: !!sel };
  }
}
</script>
</body>
</html>
