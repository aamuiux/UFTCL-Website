<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
</helmet>
<nav data-screen-label="PE ratio tabs" style="display: flex; flex-wrap: wrap; gap: 4px; max-width: 100%; font-family: var(--font-sans); font-size: 13px;">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6"><a href="{{ t.href }}" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border: 1px solid {{ t.bd }}; font-weight: 700; white-space: nowrap; text-decoration: none; background: {{ t.bg }}; color: {{ t.fg }};" style-hover="background: var(--ink); color: var(--paper); border-color: var(--ink);">{{ t.label }}</a></sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:60},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Market PE Ratio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.UFT };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const active = this.props.active || 'Market PE Ratio';
    const T = ['Market PE Ratio', 'Sector PE Ratio', 'Category PE Ratio', 'Compare PE Ratio', 'Compare Sector PE', 'Weighted PE Chart'];
    return { tabs: T.map(label => ({ label, href: U.href(label), bd: label === active ? 'var(--ink)' : 'var(--neutral-300)', bg: label === active ? 'var(--ink)' : 'var(--paper)', fg: label === active ? 'var(--paper)' : 'var(--ink)' })) };
  }
}
</script>
</body>
</html>
