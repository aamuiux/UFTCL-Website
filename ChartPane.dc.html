<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
<style>
.cp-dark { --paper: #131722; --ink: #d1d4dc; --neutral-50: #1b1f2b; --neutral-100: #1e222d; --neutral-200: #2a2e39; --neutral-300: #363a45; --neutral-400: #4c525e; --neutral-500: #787b86; --neutral-700: #b2b5be; --text-muted: #868993; --blue-700: #5b9cf6; }
.cp-sel { font: inherit; font-size: 13px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; min-width: 0; }
.cp-seg { display: flex; border: 1px solid var(--ink); }
.cp-seg button { font: inherit; font-size: 12px; height: 30px; padding: 0 10px; border: 0; border-right: 1px solid var(--ink); cursor: pointer; }
.cp-seg button:last-child { border-right: 0; }
.cp-btn { font: inherit; font-size: 12px; font-weight: 700; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.cp-btn:hover { background: var(--ink); color: var(--paper); }
.cp-btn:disabled { opacity: 0.35; cursor: default; }
.cp-btn:disabled:hover { background: var(--paper); color: var(--ink); }
.cp-menu { position: absolute; top: 36px; left: 0; z-index: 30; min-width: 200px; background: var(--paper); border: 1px solid var(--ink); }
.cp-menu-r { left: auto; right: 0; }
.cp-row { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; height: 34px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--neutral-200); background: var(--paper); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.cp-row:hover { background: var(--neutral-50); }
.cp-box { width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--paper); line-height: 1; flex-shrink: 0; }
.cp-tool { width: 34px; height: 34px; box-sizing: border-box; border: 1px solid transparent; background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.cp-tool:hover { background: var(--neutral-100); }
</style>
</helmet>
<section class="{{ themeCls }}" data-screen-label="Chart pane" style="position: {{ pos }}; inset: {{ inset }}; z-index: {{ z }}; height: {{ rootH }}; background: var(--paper); border: 1px solid var(--ink); display: flex; flex-direction: column; min-width: 0; min-height: 0; box-sizing: border-box; font-family: var(--font-sans); color: var(--ink); font-size: 13px;">

  <div data-screen-label="Chart toolbar" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border-bottom: 1px solid var(--neutral-300);">
    <select class="cp-sel" onChange="{{ onSymbol }}" value="{{ code }}" aria-label="Symbol" style="font-weight: 700; min-width: {{ symMin }};">
      <sc-for list="{{ symbolOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.code }}">{{ o.code }}</option></sc-for>
    </select>
    <sc-if value="{{ showRange }}"><div class="cp-seg" aria-label="Range"><sc-for list="{{ rangeTabs }}" as="r" hint-placeholder-count="4"><button onClick="{{ r.onClick }}" style="background: {{ r.bg }}; color: {{ r.fg }};">{{ r.label }}</button></sc-for></div></sc-if>
    <sc-if value="{{ showDates }}"><div style="display: flex; align-items: center; gap: 6px;"><input type="date" class="cp-sel" aria-label="From date" value="{{ from }}" min="{{ dMin }}" max="{{ dMax }}" onChange="{{ onFrom }}"><span style="color: var(--text-muted);">to</span><input type="date" class="cp-sel" aria-label="To date" value="{{ to }}" min="{{ dMin }}" max="{{ dMax }}" onChange="{{ onTo }}"></div></sc-if>
    <sc-if value="{{ isFull }}"><div style="position: relative;">
      <button class="cp-btn" onClick="{{ onOvMenu }}" aria-haspopup="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 12l4-5 3 3 4-6 3 4"></path></svg>Overlays<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5l3 3 3-3" fill="none" stroke="currentColor"></path></svg></button>
      <sc-if value="{{ menuOv }}"><div><div onClick="{{ closeMenu }}" style="position: fixed; inset: 0; z-index: 29;"></div><div class="cp-menu"><sc-for list="{{ ovOpts }}" as="m" hint-placeholder-count="4"><button class="cp-row" onClick="{{ m.onToggle }}"><span style="display: flex; align-items: center; gap: 8px;"><span style="width: 14px; height: 3px; background: {{ m.col }};"></span>{{ m.label }}</span><span class="cp-box" style="background: {{ m.bg }};">{{ m.mark }}</span></button></sc-for></div></div></sc-if>
    </div></sc-if>
    <sc-if value="{{ isFull }}"><div style="position: relative;">
      <button class="cp-btn" onClick="{{ onPnMenu }}" aria-haspopup="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13V3M2 13h12M5 10V7M8 10V5M11 10V8"></path></svg>Indicators<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5l3 3 3-3" fill="none" stroke="currentColor"></path></svg></button>
      <sc-if value="{{ menuPn }}"><div><div onClick="{{ closeMenu }}" style="position: fixed; inset: 0; z-index: 29;"></div><div class="cp-menu"><sc-for list="{{ pnOpts }}" as="m" hint-placeholder-count="3"><button class="cp-row" onClick="{{ m.onToggle }}"><span>{{ m.label }}</span><span class="cp-box" style="background: {{ m.bg }};">{{ m.mark }}</span></button></sc-for></div></div></sc-if>
    </div></sc-if>
    <div class="cp-seg" aria-label="Chart type"><sc-for list="{{ typeTabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.onClick }}" style="background: {{ t.bg }}; color: {{ t.fg }};">{{ t.label }}</button></sc-for></div>
    <select class="cp-sel" onChange="{{ onTf }}" value="{{ tf }}" aria-label="Timeframe" style="width: 62px;"><sc-for list="{{ tfOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select>
    <sc-if value="{{ canDraw }}"><button class="cp-btn" onClick="{{ onTheme }}" aria-label="Switch theme" title="Switch theme">{{ themeLabel }}</button></sc-if>
    <sc-if value="{{ canDraw }}"><div style="display: flex; gap: 4px;">
      <button class="cp-btn" onClick="{{ onUndo }}" disabled="{{ noUndo }}" aria-label="Undo" title="Undo" style="width: 32px; padding: 0;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3L2.500 6.500 6 10M3 6.500h6.500a4 4 0 010 8H7"></path></svg></button>
      <button class="cp-btn" onClick="{{ onRedo }}" disabled="{{ noRedo }}" aria-label="Redo" title="Redo" style="width: 32px; padding: 0;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3l3.500 3.500L10 10M13 6.500H6.500a4 4 0 000 8H9"></path></svg></button>
    </div></sc-if>
    <span style="flex: 1;"></span>
    <sc-if value="{{ canDraw }}"><button class="cp-btn" onClick="{{ onSave }}" title="Save drawings and settings in this browser"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.500 2.500h8l3 3v8h-11zM5 2.500v4h5v-4M5 13.500v-4h6v4"></path></svg>{{ saveLabel }}</button></sc-if>
    <sc-if value="{{ isFull }}"><div style="position: relative;">
      <button class="cp-btn" onClick="{{ onSetMenu }}" aria-label="Chart settings" title="Chart settings" aria-haspopup="true" style="width: 32px; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
      <sc-if value="{{ menuSet }}"><div><div onClick="{{ closeMenu }}" style="position: fixed; inset: 0; z-index: 29;"></div><div class="cp-menu cp-menu-r"><sc-for list="{{ setOpts }}" as="m" hint-placeholder-count="3"><button class="cp-row" onClick="{{ m.onToggle }}"><span>{{ m.label }}</span><span class="cp-box" style="background: {{ m.bg }};">{{ m.mark }}</span></button></sc-for></div></div></sc-if>
    </div></sc-if>
    <button class="cp-btn" onClick="{{ onFull }}" aria-label="{{ fullLabel }}" title="{{ fullLabel }}" style="width: 32px; padding: 0;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="{{ fullIcon }}"></path></svg></button>
  </div>

  <div style="display: flex; flex: 1; min-height: 0;">
    <sc-if value="{{ canDraw }}"><div data-screen-label="Drawing tools" style="width: 44px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid var(--neutral-300); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0;">
      <sc-for list="{{ tools }}" as="t" hint-placeholder-count="6"><button class="cp-tool" onClick="{{ t.onClick }}" title="{{ t.title }}" aria-label="{{ t.title }}" aria-pressed="{{ t.on }}" style="background: {{ t.bg }}; color: {{ t.fg }}; border-color: {{ t.bd }};"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg></button></sc-for>
      <span style="width: 24px; height: 1px; background: var(--neutral-300); margin: 4px 0;"></span>
      <sc-for list="{{ tools2 }}" as="t" hint-placeholder-count="3"><button class="cp-tool" onClick="{{ t.onClick }}" title="{{ t.title }}" aria-label="{{ t.title }}" aria-pressed="{{ t.on }}" style="background: {{ t.bg }}; color: {{ t.fg }}; border-color: {{ t.bd }};"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg></button></sc-for>
    </div></sc-if>

    <div style="flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;">
      <div style="padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px;"><b style="font-size: {{ titleFs }};">{{ title }}</b><span style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);">{{ dateLabel }}</span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 2px 12px; font-family: var(--font-mono); font-size: 12px;"><span style="color: var(--text-muted);">O <span style="color: {{ cc }};">{{ o }}</span></span><span style="color: var(--text-muted);">H <span style="color: {{ cc }};">{{ h }}</span></span><span style="color: var(--text-muted);">L <span style="color: {{ cc }};">{{ l }}</span></span><span style="color: var(--text-muted);">C <span style="color: {{ cc }};">{{ c }}</span></span><span style="color: {{ cc }};">{{ chg }}</span><span style="color: var(--text-muted);">Vol <span style="color: var(--ink);">{{ vol }}</span></span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 0 12px; font-family: var(--font-mono); font-size: 11px;"><sc-for list="{{ legend }}" as="g" hint-placeholder-count="2"><span style="color: {{ g.col }};">{{ g.label }} {{ g.v }}</span></sc-for><sc-if value="{{ hasHint }}"><span style="color: var(--blue-700); font-weight: 700;">{{ hint }}</span></sc-if></div>
      </div>

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; flex: 1; min-height: {{ minPlot }}; position: relative;">
        <div style="position: relative; min-width: 0; cursor: crosshair;" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" onClick="{{ onPlotClick }}">
          <svg viewBox="0 0 1000 400" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="Price chart">
            <sc-for list="{{ grid }}" as="g" hint-placeholder-count="5"><line x1="0" x2="1000" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--neutral-200)" stroke-width="1" vector-effect="non-scaling-stroke"></line></sc-for>
            <sc-for list="{{ vols }}" as="v" hint-placeholder-count="40"><rect x="{{ v.x }}" y="{{ v.y }}" width="{{ v.w }}" height="{{ v.h }}" fill="{{ v.col }}" opacity="0.45"></rect></sc-for>
            <sc-for list="{{ candles }}" as="k" hint-placeholder-count="40"><line x1="{{ k.cx }}" x2="{{ k.cx }}" y1="{{ k.hy }}" y2="{{ k.ly }}" stroke="{{ k.col }}" stroke-width="1" vector-effect="non-scaling-stroke"></line><rect x="{{ k.x }}" y="{{ k.y }}" width="{{ k.w }}" height="{{ k.h }}" fill="{{ k.col }}"></rect></sc-for>
            <path d="{{ linePath }}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
            <sc-for list="{{ overlays }}" as="p" hint-placeholder-count="2"><path d="{{ p.d }}" fill="none" stroke="{{ p.col }}" stroke-width="1.2" vector-effect="non-scaling-stroke"></path></sc-for>
            <line x1="0" x2="1000" y1="{{ lastY }}" y2="{{ lastY }}" stroke="{{ lastCol }}" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></line>
            <sc-for list="{{ dRects }}" as="r" hint-placeholder-count="1"><rect x="{{ r.x }}" y="{{ r.y }}" width="{{ r.w }}" height="{{ r.h }}" fill="{{ r.fill }}" stroke="{{ r.col }}" stroke-width="1" vector-effect="non-scaling-stroke"></rect></sc-for>
            <sc-for list="{{ dLines }}" as="s" hint-placeholder-count="2"><line x1="{{ s.x1 }}" x2="{{ s.x2 }}" y1="{{ s.y1 }}" y2="{{ s.y2 }}" stroke="{{ s.col }}" stroke-width="{{ s.w }}" stroke-dasharray="{{ s.dash }}" opacity="{{ s.op }}" vector-effect="non-scaling-stroke"></line></sc-for>
          </svg>
          <sc-for list="{{ dLabels }}" as="l" hint-placeholder-count="1"><span style="position: absolute; left: {{ l.left }}; top: {{ l.top }}; transform: translate(4px, -100%); font-family: var(--font-mono); font-size: 10px; line-height: 14px; padding: 0 3px; background: var(--paper); color: {{ l.col }}; pointer-events: none; white-space: nowrap;">{{ l.text }}</span></sc-for>
          <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
          <sc-if value="{{ showWm }}"><div style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--font-sans-b); font-size: {{ wmFs }}; letter-spacing: 0.08em; color: var(--neutral-200); opacity: 0.55; pointer-events: none; white-space: nowrap;" aria-hidden="true">UFTCL</div></sc-if>
        </div>
        <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">
          <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="5"><span style="position: absolute; left: 6px; top: {{ t.top }}; transform: translateY(-50%);">{{ t.label }}</span></sc-for>
          <sc-for list="{{ dTags }}" as="t" hint-placeholder-count="1"><span style="position: absolute; left: 0; right: 0; top: {{ t.top }}; transform: translateY(-50%); background: var(--blue-700); color: var(--paper); padding: 1px 6px; font-weight: 700;">{{ t.label }}</span></sc-for>
          <span style="position: absolute; left: 0; right: 0; top: {{ lastTop }}; transform: translateY(-50%); background: {{ lastCol }}; color: #fff; padding: 1px 6px; font-weight: 700;">{{ lastLabel }}</span>
        </div>
      </div>

      <sc-if value="{{ rsiOn }}"><div data-screen-label="RSI pane" style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 110px; flex-shrink: 0; border-top: 1px solid var(--neutral-400); position: relative;">
        <div style="position: relative; min-width: 0;">
          <svg viewBox="0 0 1000 120" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="RSI">
            <rect x="0" y="{{ rsiTop }}" width="1000" height="{{ rsiBand }}" fill="var(--neutral-100)"></rect>
            <line x1="0" x2="1000" y1="{{ rsiTop }}" y2="{{ rsiTop }}" stroke="var(--neutral-400)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></line>
            <line x1="0" x2="1000" y1="{{ rsiBot }}" y2="{{ rsiBot }}" stroke="var(--neutral-400)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></line>
            <path d="{{ rsiLine }}" fill="none" stroke="var(--blue-700)" stroke-width="1.3" vector-effect="non-scaling-stroke"></path>
          </svg>
          <div style="position: absolute; left: 8px; top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">{{ rsiText }}</div>
          <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
        </div>
        <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><span style="position: absolute; left: 6px; top: {{ rsiTopPct }}; transform: translateY(-50%);">70</span><span style="position: absolute; left: 6px; top: {{ rsiBotPct }}; transform: translateY(-50%);">30</span></div>
      </div></sc-if>

      <sc-if value="{{ macdOn }}"><div data-screen-label="MACD pane" style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 130px; flex-shrink: 0; border-top: 1px solid var(--neutral-400); position: relative;">
        <div style="position: relative; min-width: 0;">
          <svg viewBox="0 0 1000 120" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="MACD">
            <line x1="0" x2="1000" y1="60" y2="60" stroke="var(--neutral-300)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <sc-for list="{{ macdBars }}" as="b" hint-placeholder-count="40"><rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ b.col }}"></rect></sc-for>
            <path d="{{ macdLine }}" fill="none" stroke="var(--blue-700)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
            <path d="{{ sigLine }}" fill="none" stroke="var(--red-700)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
          </svg>
          <div style="position: absolute; left: 8px; top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">{{ macdText }}</div>
          <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
        </div>
        <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><span style="position: absolute; left: 6px; top: 6px;">{{ macdMax }}</span><span style="position: absolute; left: 6px; top: 50%; transform: translateY(-50%);">0</span><span style="position: absolute; left: 6px; bottom: 6px;">{{ macdMin }}</span></div>
      </div></sc-if>

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 24px; flex-shrink: 0; border-top: 1px solid var(--neutral-300);">
        <div style="position: relative; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><sc-for list="{{ xticks }}" as="x" hint-placeholder-count="6"><span style="position: absolute; top: 5px; left: {{ x.left }}; transform: translateX(-50%); white-space: nowrap;">{{ x.label }}</span></sc-for></div>
        <span style="border-left: 1px solid var(--neutral-300);"></span>
      </div>
    </div>
  </div>
</section>

      out.onTheme = () => this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark', saved: false })); out.themeLabel = st.theme === 'dark' ? 'Dark' : 'Light';
      out.saveLabel = st.saved ? 'Saved' : 'Save';
      out.onSave = () => { const ok = this.writeStore(this.skey(), { code, tf, type, range, ov: ovKeys, pn: pnKeys, theme: st.theme, grid: st.grid, wm: st.wm, log: st.log, dmap: st.dmap }); this.setState({ saved: ok }); };
      const HINT = { trend: 'Click two points to draw a trend line', fib: 'Click two points to draw Fib levels', rect: 'Click two corners to draw a rectangle', measure: 'Click two points to measure', hline: 'Click to place a horizontal line' };
      out.hint = st.lockD ? 'Drawings are locked' : st.pending ? 'Click the second point (Esc to cancel)' : (HINT[st.tool] || ''); out.hasHint = !!out.hint;
      out.onPlotClick = e => {
        if (st.lockD || st.tool === 'cross') return;
        const r = e.currentTarget.getBoundingClientRect(); const idx = Math.max(0, Math.min(cnt - 1, Math.floor((e.clientX - r.left) / r.width * cnt)));
        const pt = { i: o0 + idx, p: priceAt((e.clientY - r.top) / r.height * 400) };
        const list = st.dmap[dkey] || [];
        if (st.tool === 'hline') { this.commit(dkey, [...list, { t: 'h', p: pt.p }]); return; }
        if (!st.pending) { this.setState({ pending: pt, cur: pt, meas: null }); return; }
        if (st.tool === 'measure') { this.setState({ meas: { a: st.pending, b: pt }, pending: null }); return; }
        this.commit(dkey, [...list, { t: st.tool, a: st.pending, b: pt }]); this.setState({ pending: null });
      };
    } else { out.onPlotClick = () => {}; out.hasHint = false; out.hint = ''; }

    if (macdOn) {
      const m = D.macd.slice(o0, o1), sg = D.sig.slice(o0, o1), hs = D.hist.slice(o0, o1); const ext = Math.max(...m.map(Math.abs), ...sg.map(Math.abs), ...hs.map(Math.abs)) || 1;
      const Y2 = v => 60 - v / ext * 52; const line = a => a.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y2(v).toFixed(2)).join('');
      out.macdBars = hs.map((v, i) => ({ x: (X(i) - bw * 0.3).toFixed(2), w: (bw * 0.6).toFixed(2), y: Math.min(Y2(v), 60).toFixed(2), h: Math.max(0.5, Math.abs(Y2(v) - 60)).toFixed(2), col: v >= 0 ? UPc : DNc }));
      out.macdLine = line(m); out.sigLine = line(sg); out.macdMax = U.fmt(ext, ext < 10 ? 2 : 0); out.macdMin = U.fmt(-ext, ext < 10 ? 2 : 0);
      out.macdText = `MACD(12,26,9)  DIFF: ${U.fmt(m[hv], 2)}  DEA: ${U.fmt(sg[hv], 2)}  MACD: ${U.fmt(hs[hv], 2)}`;
    }
    if (rsiOn) {
      const rs = D.rsi.slice(o0, o1); const Y3 = v => 4 + (100 - v) / 100 * 112;
      out.rsiLine = rs.map((v, i) => v == null ? '' : ((rs[i - 1] == null ? 'M' : 'L') + X(i).toFixed(2) + ' ' + Y3(v).toFixed(2))).join('');
      out.rsiTop = Y3(70).toFixed(1); out.rsiBot = Y3(30).toFixed(1); out.rsiBand = (Y3(30) - Y3(70)).toFixed(1); out.rsiTopPct = (Y3(70) / 1.2).toFixed(1) + '%'; out.rsiBotPct = (Y3(30) / 1.2).toFixed(1) + '%';
      out.rsiText = `RSI(14)  ${rs[hv] == null ? '-' : U.fmt(rs[hv], 2)}`;
    }
    return out;
  }
}
