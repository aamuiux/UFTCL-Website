<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
<style>
.cp-sel { font: inherit; font-size: 13px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; min-width: 0; }
.cp-seg { display: flex; border: 1px solid var(--ink); }
.cp-seg button { font: inherit; font-size: 12px; height: 30px; padding: 0 10px; border: 0; border-right: 1px solid var(--ink); cursor: pointer; }
.cp-seg button:last-child { border-right: 0; }
.cp-btn { font: inherit; font-size: 12px; font-weight: 700; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.cp-btn:hover { background: var(--ink); color: var(--paper); }
.cp-menu { position: absolute; top: 36px; left: 0; z-index: 30; min-width: 200px; background: var(--paper); border: 1px solid var(--ink); }
.cp-row { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; height: 34px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--neutral-200); background: var(--paper); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.cp-row:hover { background: var(--neutral-50); }
.cp-box { width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: var(--paper); line-height: 1; flex-shrink: 0; }
</style>
</helmet>
<section data-screen-label="Chart pane" style="position: {{ pos }}; inset: {{ inset }}; z-index: {{ z }}; height: {{ rootH }}; background: var(--paper); border: 1px solid var(--ink); display: flex; flex-direction: column; min-width: 0; min-height: 0; box-sizing: border-box; font-family: var(--font-sans); color: var(--ink); font-size: 13px;">

  <div data-screen-label="Chart toolbar" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 10px; border-bottom: 1px solid var(--neutral-300);">
    <select class="cp-sel" onChange="{{ onSymbol }}" value="{{ code }}" aria-label="Symbol" style="font-weight: 700; min-width: {{ symMin }};">
      <sc-for list="{{ symbolOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.code }}">{{ o.code }}</option></sc-for>
    </select>
    <sc-if value="{{ isFull }}"><div class="cp-seg" aria-label="Range"><sc-for list="{{ rangeTabs }}" as="r" hint-placeholder-count="4"><button onClick="{{ r.onClick }}" style="background: {{ r.bg }}; color: {{ r.fg }};">{{ r.label }}</button></sc-for></div></sc-if>
    <sc-if value="{{ isFull }}"><div style="position: relative;">
      <button class="cp-btn" onClick="{{ onOvMenu }}" aria-haspopup="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 12l4-5 3 3 4-6 3 4"></path></svg>Overlays<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5l3 3 3-3" fill="none" stroke="currentColor"></path></svg></button>
      <sc-if value="{{ menuOv }}"><div><div onClick="{{ closeMenu }}" style="position: fixed; inset: 0; z-index: 29;"></div><div class="cp-menu"><sc-for list="{{ ovOpts }}" as="m" hint-placeholder-count="4"><button class="cp-row" onClick="{{ m.onToggle }}"><span style="display: flex; align-items: center; gap: 8px;"><span style="width: 14px; height: 3px; background: {{ m.col }};"></span>{{ m.label }}</span><span class="cp-box" style="background: {{ m.bg }};">{{ m.mark }}</span></button></sc-for></div></div></sc-if>
    </div></sc-if>
    <sc-if value="{{ isFull }}"><div style="position: relative;">
      <button class="cp-btn" onClick="{{ onPnMenu }}" aria-haspopup="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 13V3M2 13h12M5 10V7M8 10V5M11 10V8"></path></svg>Indicators<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 2.5l3 3 3-3" fill="none" stroke="currentColor"></path></svg></button>
      <sc-if value="{{ menuPn }}"><div><div onClick="{{ closeMenu }}" style="position: fixed; inset: 0; z-index: 29;"></div><div class="cp-menu"><sc-for list="{{ pnOpts }}" as="m" hint-placeholder-count="3"><button class="cp-row" onClick="{{ m.onToggle }}"><span>{{ m.label }}</span><span class="cp-box" style="background: {{ m.bg }};">{{ m.mark }}</span></button></sc-for></div></div></sc-if>
    </div></sc-if>
    <div class="cp-seg" aria-label="Chart type"><sc-for list="{{ typeTabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.onClick }}" style="background: {{ t.bg }}; color: {{ t.fg }};">{{ t.label }}</button></sc-for></div>
    <select class="cp-sel" onChange="{{ onTf }}" value="{{ tf }}" aria-label="Timeframe" style="width: 62px;"><sc-for list="{{ tfOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select>
    <span style="flex: 1;"></span>
    <button class="cp-btn" onClick="{{ onFull }}" aria-label="{{ fullLabel }}" title="{{ fullLabel }}" style="width: 32px; padding: 0;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="{{ fullIcon }}"></path></svg></button>
  </div>

  <div style="padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 3px;">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px;"><b style="font-size: {{ titleFs }};">{{ title }}</b><span style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);">{{ dateLabel }}</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 2px 12px; font-family: var(--font-mono); font-size: 12px;"><span style="color: var(--text-muted);">O <span style="color: {{ cc }};">{{ o }}</span></span><span style="color: var(--text-muted);">H <span style="color: {{ cc }};">{{ h }}</span></span><span style="color: var(--text-muted);">L <span style="color: {{ cc }};">{{ l }}</span></span><span style="color: var(--text-muted);">C <span style="color: {{ cc }};">{{ c }}</span></span><span style="color: {{ cc }};">{{ chg }}</span><span style="color: var(--text-muted);">Vol <span style="color: var(--ink);">{{ vol }}</span></span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 0 12px; font-family: var(--font-mono); font-size: 11px;"><sc-for list="{{ legend }}" as="g" hint-placeholder-count="2"><span style="color: {{ g.col }};">{{ g.label }} {{ g.v }}</span></sc-for></div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; flex: 1; min-height: {{ minPlot }}; position: relative;">
    <div style="position: relative; min-width: 0; cursor: crosshair;" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}">
      <svg viewBox="0 0 1000 400" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="Price chart">
        <sc-for list="{{ grid }}" as="g" hint-placeholder-count="5"><line x1="0" x2="1000" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--neutral-200)" stroke-width="1" vector-effect="non-scaling-stroke"></line></sc-for>
        <sc-for list="{{ vols }}" as="v" hint-placeholder-count="40"><rect x="{{ v.x }}" y="{{ v.y }}" width="{{ v.w }}" height="{{ v.h }}" fill="{{ v.col }}" opacity="0.45"></rect></sc-for>
        <sc-for list="{{ candles }}" as="k" hint-placeholder-count="40"><line x1="{{ k.cx }}" x2="{{ k.cx }}" y1="{{ k.hy }}" y2="{{ k.ly }}" stroke="{{ k.col }}" stroke-width="1" vector-effect="non-scaling-stroke"></line><rect x="{{ k.x }}" y="{{ k.y }}" width="{{ k.w }}" height="{{ k.h }}" fill="{{ k.col }}"></rect></sc-for>
        <path d="{{ linePath }}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
        <sc-for list="{{ overlays }}" as="p" hint-placeholder-count="2"><path d="{{ p.d }}" fill="none" stroke="{{ p.col }}" stroke-width="1.2" vector-effect="non-scaling-stroke"></path></sc-for>
        <line x1="0" x2="1000" y1="{{ lastY }}" y2="{{ lastY }}" stroke="{{ lastCol }}" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></line>
      </svg>
      <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
      <div style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--font-sans-b); font-size: {{ wmFs }}; letter-spacing: 0.08em; color: var(--neutral-200); opacity: 0.55; pointer-events: none; white-space: nowrap;" aria-hidden="true">UFTCL</div>
    </div>
    <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">
      <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="5"><span style="position: absolute; left: 6px; top: {{ t.top }}; transform: translateY(-50%);">{{ t.label }}</span></sc-for>
      <span style="position: absolute; left: 0; right: 0; top: {{ lastTop }}; transform: translateY(-50%); background: {{ lastCol }}; color: var(--paper); padding: 1px 6px; font-weight: 700;">{{ lastLabel }}</span>
    </div>
  </div>

  <sc-if value="{{ macdOn }}"><div data-screen-label="MACD pane" style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 130px; flex-shrink: 0; border-top: 1px solid var(--ink); position: relative;">
    <div style="position: relative; min-width: 0;">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="MACD">
        <line x1="0" x2="1000" y1="60" y2="60" stroke="var(--neutral-300)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
        <sc-for list="{{ macdBars }}" as="b" hint-placeholder-count="40"><rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ b.col }}"></rect></sc-for>
        <path d="{{ macdLine }}" fill="none" stroke="var(--blue-700)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
        <path d="{{ sigLine }}" fill="none" stroke="var(--red-700)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div style="position: absolute; left: 8px; top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">{{ macdText }}</div>
      <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
    </div>
    <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><span style="position: absolute; left: 6px; top: 6px;">{{ macdMax }}</span><span style="position: absolute; left: 6px; top: 50%; transform: translateY(-50%);">0</span><span style="position: absolute; left: 6px; bottom: 6px;">{{ macdMin }}</span></div>
  </div></sc-if>

  <sc-if value="{{ rsiOn }}"><div data-screen-label="RSI pane" style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 110px; flex-shrink: 0; border-top: 1px solid var(--ink); position: relative;">
    <div style="position: relative; min-width: 0;">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-label="RSI">
        <rect x="0" y="{{ rsiTop }}" width="1000" height="{{ rsiBand }}" fill="var(--neutral-100)"></rect>
        <line x1="0" x2="1000" y1="{{ rsiTop }}" y2="{{ rsiTop }}" stroke="var(--neutral-400)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></line>
        <line x1="0" x2="1000" y1="{{ rsiBot }}" y2="{{ rsiBot }}" stroke="var(--neutral-400)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></line>
        <path d="{{ rsiLine }}" fill="none" stroke="var(--blue-700)" stroke-width="1.3" vector-effect="non-scaling-stroke"></path>
      </svg>
      <div style="position: absolute; left: 8px; top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">{{ rsiText }}</div>
      <sc-if value="{{ showHover }}"><div style="position: absolute; top: 0; bottom: 0; left: {{ hoverLeft }}; width: 1px; background: var(--neutral-500); pointer-events: none;"></div></sc-if>
    </div>
    <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><span style="position: absolute; left: 6px; top: {{ rsiTopPct }}; transform: translateY(-50%);">70</span><span style="position: absolute; left: 6px; top: {{ rsiBotPct }}; transform: translateY(-50%);">30</span></div>
  </div></sc-if>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 58px; height: 24px; flex-shrink: 0; border-top: 1px solid var(--neutral-300);">
    <div style="position: relative; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);"><sc-for list="{{ xticks }}" as="x" hint-placeholder-count="6"><span style="position: absolute; top: 5px; left: {{ x.left }}; transform: translateX(-50%); white-space: nowrap;">{{ x.label }}</span></sc-for></div>
    <span style="border-left: 1px solid var(--neutral-300);"></span>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DSEX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tf&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;D&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;candle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;range&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1Y&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;overlays&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;panes&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sync&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;urlsym&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.UFT, code: null, tf: null, type: null, range: null, ov: null, pn: null, menu: null, hover: -1, full: false };

  componentDidMount() {
    this.pid = 'p' + Math.random().toString(36).slice(2);
    if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50);
    this.onSym = e => { const d = e.detail || {}; if (this.props.sync === '1' && d.src !== this.pid && d.code) this.setState({ code: d.code, hover: -1 }); };
    this.onKey = e => { if (e.key === 'Escape') this.setState(s => (s.full || s.menu ? { full: false, menu: null } : null)); };
    window.addEventListener('uft-chart-symbol', this.onSym); window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { clearInterval(this.p); window.removeEventListener('uft-chart-symbol', this.onSym); window.removeEventListener('keydown', this.onKey); }

  series(code, tf) {
    const U = window.UFT; this._s = this._s || {}; const key = code + '|' + tf; if (this._s[key]) return this._s[key];
    const bars = U.chartBars(code, tf); const cl = bars.map(b => b.c);
    const sma = (a, p) => { let s = 0; return a.map((x, i) => { s += x; if (i >= p) s -= a[i - p]; return i < p - 1 ? null : s / p; }); };
    const ema = (a, p) => { const k = 2 / (p + 1); let e = a[0]; return a.map((x, i) => (e = i ? x * k + e * (1 - k) : x)); };
    const e12 = ema(cl, 12), e26 = ema(cl, 26); const macd = e12.map((x, i) => x - e26[i]); const sig = ema(macd, 9); const hist = macd.map((x, i) => x - sig[i]);
    return (this._s[key] = { bars, ma20: sma(cl, 20), ema50: ema(cl, 50), sma100: sma(cl, 100), sma200: sma(cl, 200), macd, sig, hist, rsi: U.rsiSeries(cl, 14) });
  }

  changeSymbol(code) { this.setState({ code, hover: -1 }); window.dispatchEvent(new CustomEvent('uft-chart-symbol', { detail: { code, src: this.pid } })); }

  renderVals() {
    const U = window.UFT; if (!U || !U.chartBars) return {};
    const st = this.state, P = this.props || {};
    const isFull = P.mode === 'full';
    let initCode = P.code || 'DSEX';
    if (P.urlsym === '1') { const q = (U.param('symbol', '') || '').toUpperCase(); if (U.bySym[q] || U.indices[q]) initCode = q; }
    const code = st.code || initCode; const tf = st.tf || P.tf || 'D'; const type = st.type || P.type || 'candle'; const range = st.range || P.range || '1Y';
    const ovKeys = st.ov || (P.overlays || '').split(',').filter(Boolean); const pnKeys = st.pn || (P.panes || '').split(',').filter(Boolean);
    const D = this.series(code, tf); const nAll = D.bars.length;

    const RANGES = { '3M': 63, '6M': 126, '1Y': 252, '2Y': 504 };
    let cnt;
    if (tf === '1m') cnt = nAll; else if (isFull) cnt = Math.max(24, Math.round(RANGES[range] / (tf === 'D' ? 1 : tf === 'W' ? 5 : 21))); else cnt = { D: 120, W: 100, M: 60 }[tf];
    cnt = Math.min(cnt, nAll); const o0 = nAll - cnt; const bars = D.bars.slice(o0);
    const W = 1000, bw = W / cnt, X = i => (i + 0.5) * bw;
    const volOn = !isFull || pnKeys.includes('volume'); const macdOn = isFull && pnKeys.includes('macd'); const rsiOn = isFull && pnKeys.includes('rsi');

    const OV = [['ema50', 'EMA(50)', 'var(--red-700)'], ['ma20', 'MA(20)', 'var(--green-700)'], ['sma100', 'SMA(100)', 'var(--blue-700)'], ['sma200', 'SMA(200)', 'var(--neutral-700)']];
    const ovOn = OV.filter(([k]) => ovKeys.includes(k));
    let mx = Math.max(...bars.map(b => b.h)), mn = Math.min(...bars.map(b => b.l));
    ovOn.forEach(([k]) => D[k].slice(o0).forEach(v => { if (v != null) { mx = Math.max(mx, v); mn = Math.min(mn, v); } }));
    const padv = (mx - mn) * 0.06 || 1; mx += padv; mn -= padv;
    const top = 8, bot = volOn ? 296 : 392; const Y = v => top + (mx - v) / (mx - mn) * (bot - top);
    const span = mx - mn; const dec = span < 4 ? 2 : span < 60 ? 1 : 0; const f = v => U.fmt(v, dec);
    const UPc = 'var(--green-700)', DNc = 'var(--red-700)';

    const candles = type === 'candle' ? bars.map((b, i) => { const col = b.c >= b.o ? UPc : DNc; const yo = Y(b.o), yc = Y(b.c); return { cx: X(i).toFixed(2), hy: Y(b.h).toFixed(2), ly: Y(b.l).toFixed(2), x: (X(i) - bw * 0.31).toFixed(2), w: (bw * 0.62).toFixed(2), y: Math.min(yo, yc).toFixed(2), h: Math.max(1, Math.abs(yo - yc)).toFixed(2), col }; }) : [];
    const linePath = type === 'line' ? bars.map((b, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(b.c).toFixed(2)).join('') : '';
    const vmax = Math.max(...bars.map(b => b.v)) || 1;
    const vols = volOn ? bars.map((b, i) => { const hh = b.v / vmax * 64; return { x: (X(i) - bw * 0.31).toFixed(2), w: (bw * 0.62).toFixed(2), y: (400 - hh).toFixed(2), h: hh.toFixed(2), col: b.c >= b.o ? UPc : DNc }; }) : [];
    const path = arr => { let d = '', on = false; arr.forEach((v, i) => { if (v == null) { on = false; return; } d += (on ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(v).toFixed(2); on = true; }); return d; };
    const overlays = ovOn.map(([k, label, col]) => ({ d: path(D[k].slice(o0)), col }));

    const hv = st.hover >= 0 && st.hover < cnt ? st.hover : cnt - 1; const hb = bars[hv];
    const prevC = hv > 0 ? bars[hv - 1].c : (o0 > 0 ? D.bars[o0 - 1].c : hb.o);
    const chgV = hb.c - prevC, chgP = prevC ? chgV / prevC * 100 : 0; const cc = U.tone(chgV);
    const last = bars[cnt - 1]; const lastPrev = cnt > 1 ? bars[cnt - 2].c : last.o; const lastCol = last.c >= lastPrev ? UPc : DNc;

    const grid = [0.1, 0.3, 0.5, 0.7, 0.9].map(q => ({ y: Y(mn + span * q).toFixed(1) }));
    const ticks = [0.1, 0.3, 0.5, 0.7, 0.9].map(q => { const v = mn + span * (1 - q); return { top: (Y(v) / 4).toFixed(1) + '%', label: f(v) }; });
    const xticks = [0, 1, 2, 3, 4, 5].map(k => { const i = Math.min(cnt - 1, Math.round((k + 0.5) * cnt / 6)); return { left: (X(i) / 10).toFixed(1) + '%', label: bars[i].t }; });

    const ovLegend = ovOn.map(([k, label, col]) => { const v = D[k][o0 + hv]; return { label, col, v: v == null ? '' : f(v) }; });
    const isIx = !!U.indices[code]; const NAMES = { DSEX: 'Dhaka Stock Exchange Broad Index', DSES: 'DSE Shariah Index', DS30: 'DSE 30 Index' };
    const full = st.full; const TFL = { '1m': '1m', D: '1D', W: '1W', M: '1M' }[tf];
    const out = {
      pos: full ? 'fixed' : 'relative', inset: full ? '0' : 'auto', z: full ? 80 : 'auto', rootH: full ? '100vh' : (P.height || '100%'),
      isFull, code, tf, symMin: isFull ? '150px' : '90px', symbolOptions: [...Object.keys(U.indices), ...U.symbols].map(c => ({ code: c })),
      onSymbol: e => this.changeSymbol(e.target.value), onTf: e => this.setState({ tf: e.target.value, hover: -1 }),
      tfOpts: [['1m', '1m'], ['D', 'D'], ['W', 'W'], ['M', 'M']].map(([value, label]) => ({ value, label })),
      rangeTabs: ['3M', '6M', '1Y', '2Y'].map(r => ({ label: r, bg: r === range ? 'var(--ink)' : 'var(--paper)', fg: r === range ? 'var(--paper)' : 'var(--ink)', onClick: () => this.setState({ range: r }) })),
      typeTabs: [['candle', 'Candle'], ['line', 'Line']].map(([k, label]) => ({ label, bg: type === k ? 'var(--ink)' : 'var(--paper)', fg: type === k ? 'var(--paper)' : 'var(--ink)', onClick: () => this.setState({ type: k }) })),
      menuOv: st.menu === 'ov', menuPn: st.menu === 'pn', onOvMenu: () => this.setState(s => ({ menu: s.menu === 'ov' ? null : 'ov' })), onPnMenu: () => this.setState(s => ({ menu: s.menu === 'pn' ? null : 'pn' })), closeMenu: () => this.setState({ menu: null }),
      ovOpts: OV.map(([k, label, col]) => { const on = ovKeys.includes(k); return { label, col, mark: on ? '✓' : '', bg: on ? 'var(--ink)' : 'var(--paper)', onToggle: () => this.setState({ ov: on ? ovKeys.filter(x => x !== k) : [...ovKeys, k] }) }; }),
      pnOpts: [['volume', 'Volume'], ['macd', 'MACD (12,26,9)'], ['rsi', 'RSI (14)']].map(([k, label]) => { const on = pnKeys.includes(k); return { label, mark: on ? '✓' : '', bg: on ? 'var(--ink)' : 'var(--paper)', onToggle: () => this.setState({ pn: on ? pnKeys.filter(x => x !== k) : [...pnKeys, k] }) }; }),
      onFull: () => this.setState(s => ({ full: !s.full })), fullLabel: full ? 'Exit full screen' : 'Full screen',
      fullIcon: full ? 'M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4' : 'M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4',
      title: (isIx ? NAMES[code] : U.company(code)) + ' · ' + TFL, titleFs: isFull ? '15px' : '13px', dateLabel: hb.t, wmFs: isFull ? '72px' : '34px', minPlot: isFull ? '300px' : '170px',
      o: f(hb.o), h: f(hb.h), l: f(hb.l), c: f(hb.c), chg: `${U.sign(chgV, dec)} (${U.sign(chgP)}%)`, cc, vol: U.fmtInt(hb.v), legend: ovLegend,
      grid, vols, candles, linePath, overlays, ticks, xticks, lastY: Y(last.c).toFixed(2), lastTop: (Y(last.c) / 4).toFixed(1) + '%', lastLabel: f(last.c), lastCol,
      onMove: e => { const r = e.currentTarget.getBoundingClientRect(); const i = Math.max(0, Math.min(cnt - 1, Math.floor((e.clientX - r.left) / r.width * cnt))); if (i !== st.hover) this.setState({ hover: i }); },
      onLeave: () => this.setState({ hover: -1 }), showHover: st.hover >= 0 && st.hover < cnt, hoverLeft: (X(hv) / 10).toFixed(2) + '%',
      macdOn, rsiOn,
    };

    if (macdOn) {
      const m = D.macd.slice(o0), sg = D.sig.slice(o0), hs = D.hist.slice(o0); const ext = Math.max(...m.map(Math.abs), ...sg.map(Math.abs), ...hs.map(Math.abs)) || 1;
      const Y2 = v => 60 - v / ext * 52; const line = a => a.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y2(v).toFixed(2)).join('');
      out.macdBars = hs.map((v, i) => ({ x: (X(i) - bw * 0.3).toFixed(2), w: (bw * 0.6).toFixed(2), y: Math.min(Y2(v), 60).toFixed(2), h: Math.max(0.5, Math.abs(Y2(v) - 60)).toFixed(2), col: v >= 0 ? UPc : DNc }));
      out.macdLine = line(m); out.sigLine = line(sg); out.macdMax = U.fmt(ext, ext < 10 ? 2 : 0); out.macdMin = U.fmt(-ext, ext < 10 ? 2 : 0);
      out.macdText = `MACD(12,26,9)  DIFF: ${U.fmt(m[hv], 2)}  DEA: ${U.fmt(sg[hv], 2)}  MACD: ${U.fmt(hs[hv], 2)}`;
    }
    if (rsiOn) {
      const rs = D.rsi.slice(o0); const Y3 = v => 4 + (100 - v) / 100 * 112;
      out.rsiLine = rs.map((v, i) => v == null ? '' : ((rs[i - 1] == null ? 'M' : 'L') + X(i).toFixed(2) + ' ' + Y3(v).toFixed(2))).join('');
      out.rsiTop = Y3(70).toFixed(1); out.rsiBot = Y3(30).toFixed(1); out.rsiBand = (Y3(30) - Y3(70)).toFixed(1); out.rsiTopPct = (Y3(70) / 1.2).toFixed(1) + '%'; out.rsiBotPct = (Y3(30) / 1.2).toFixed(1) + '%';
      out.rsiText = `RSI(14)  ${rs[hv] == null ? '-' : U.fmt(rs[hv], 2)}`;
    }
    return out;
  }
}
