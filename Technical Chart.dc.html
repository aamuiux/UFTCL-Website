<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Technical & Fundamental Chart — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="market" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 24px;">

  <dc-import name="ChartPane" mode="full" code="DSEX" tf="D" range="1Y" overlays="ema50,ma20" panes="volume,macd" urlsym="1" sync="0" height="780px" hint-size="100%,780px"></dc-import>

  <section data-screen-label="Fundamentals" style="border: 1px solid var(--ink);">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--ink);">
      <b style="font-size: 15px;">Fundamentals · {{ code }}</b>
      <span style="font-size: 12px; color: var(--text-muted);">{{ sub }}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="10"><div style="padding: 14px 16px; border-right: 1px solid var(--neutral-200); border-bottom: 1px solid var(--neutral-200); display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: var(--text-muted);">{{ t.label }}</span><span style="font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: {{ t.col }};">{{ t.value }}</span></div></sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;">
      <a href="{{ stockHref }}" style="height: 36px; padding: 0 16px; border: 1px solid var(--ink); display: inline-flex; align-items: center; font-weight: 700; font-size: 13px;" style-hover="background: var(--ink); color: var(--paper);">Open full stock page</a>
      <a href="{{ interactiveHref }}" style="height: 36px; padding: 0 16px; border: 1px solid var(--ink); display: inline-flex; align-items: center; font-weight: 700; font-size: 13px;" style-hover="background: var(--ink); color: var(--paper);">Open interactive chart</a>
    </div>
  </section>

  <dc-import name="SymbolIndex" page="Technical Chart" hint-size="100%,120px"></dc-import>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.UFT, code: null };
  componentDidMount() {
    if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50);
    this.onSym = e => { const d = e.detail || {}; if (d.code) this.setState({ code: d.code }); };
    window.addEventListener('uft-chart-symbol', this.onSym);
  }
  componentWillUnmount() { clearInterval(this.p); window.removeEventListener('uft-chart-symbol', this.onSym); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const q = (U.param('symbol', '') || '').toUpperCase(); const init = U.bySym[q] || U.indices[q] ? q : 'DSEX';
    const code = this.state.code || init; const S = U.bySym[code]; const IX = U.indices[code]; const { fmt, fmtInt, sign, tone } = U;
    let tiles = [], sub = '';
    if (S) {
      const range = S.high - S.low;
      tiles = [['Sector', S.sector], ['Category', S.cat], ['Board', S.board], ['LTP', fmt(S.ltp, 1)], ['Change', `${sign(S.change)} (${sign(S.changePct)}%)`, tone(S.change)], ['Audited PE', S.pe > 0 ? fmt(S.pe, 2) : '-'], ['EPS', fmt(S.eps, 2)], ['NAV per share', fmt(S.nav, 2)], ['Price / NAV', fmt(S.ltp / S.nav, 2)],
        ['Market cap (mn)', fmtInt(S.mcap)], ['Beta', fmt(S.beta, 2)], ['Director holding', fmt(S.director, 2) + '%'], ['52-week range', `${fmt(S.w52l, 1)} – ${fmt(S.w52h, 1)}`], ['Day range', `${fmt(S.low, 1)} – ${fmt(S.high, 1)}`], ['Volume', fmtInt(S.volume)], ['Value (mn)', fmt(S.value, 2)]];
      sub = `${U.company(code)} · mock data, as of the last session`;
    } else if (IX) {
      tiles = [['Index value', fmt(IX.value, 2)], ['Change', `${sign(IX.change)} (${sign(IX.pct)}%)`, tone(IX.change)], ['Previous close', fmt(IX.prev, 2)], ['Open', fmt(IX.open, 2)], ['High', fmt(IX.high, 2)], ['Low', fmt(IX.low, 2)], ['52-week low', fmt(IX.w52l, 2)], ['52-week high', fmt(IX.w52h, 2)], ['6-month return', sign(IX.ret6m) + '%', tone(IX.ret6m)], ['1-year return', sign(IX.ret1y) + '%', tone(IX.ret1y)]];
      sub = 'Index snapshot · mock data, as of the last session';
    }
    return { code, sub, tiles: tiles.map(([label, value, col]) => ({ label, value, col: col || 'var(--ink)' })), stockHref: S ? U.actions(code).stock : U.href('Market Watch', { symbol: code }), interactiveHref: U.href('Chart', { symbol: S ? code : 'GP' }) };
  }
}
</script>
</body>
</html>
