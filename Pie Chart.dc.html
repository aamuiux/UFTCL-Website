<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Sectoral pie chart — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
.tl-ctl { font: inherit; font-size: 13px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.tl-btn { font: inherit; font-size: 13px; font-weight: 700; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tl-btn:hover { background: var(--ink); color: var(--paper); }



.pc-leg { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 0; background: transparent; font: inherit; font-size: 13px; cursor: pointer; text-align: left; width: 100%; }
.pc-leg:hover { background: var(--neutral-100); }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="tools" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
<section style="display: flex; flex-direction: column; gap: 4px;">
  <h1 style="margin: 0; font-family: var(--font-sans-b); font-size: 34px; line-height: 43px;">Sectoral pie chart</h1>
  <div style="color: var(--text-muted);">Share of each sector in total turnover. Each ring is one trading session, with the latest session on the outside.</div>
</section>

<dc-import name="ToolTabs" active="Pie Chart" hint-size="100%,40px"></dc-import>
<section style="border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 14px;">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;">
    <div role="tablist" aria-label="Session" style="display: flex; flex-wrap: wrap; border: 1px solid var(--ink);"><sc-for list="{{ dayTabs }}" as="t" hint-placeholder-count="6"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.onClick }}" style="font: inherit; font-size: 13px; height: 34px; padding: 0 12px; border: 0; border-left: {{ t.bl }}; background: {{ t.bg }}; color: {{ t.fg }}; cursor: pointer;">{{ t.label }}</button></sc-for></div>
    <span style="font-size: 13px; color: var(--text-muted);">{{ ringNote }}</span>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center;">
    <div style="position: relative; width: min(100%, 520px); aspect-ratio: 1;">
      <svg viewBox="0 0 500 500" style="width: 100%; height: 100%; display: block;" role="img" aria-label="Sector share of turnover by session">
        <sc-for list="{{ arcs }}" as="a" hint-placeholder-count="30"><path d="{{ a.d }}" fill="{{ a.c }}" fill-opacity="{{ a.o }}" stroke="var(--paper)" stroke-width="1" onMouseEnter="{{ a.enter }}" onMouseLeave="{{ leave }}"><title>{{ a.tip }}</title></path></sc-for>
      </svg>
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 120px; pointer-events: none;"><div style="font-size: 11px; color: var(--text-muted); line-height: 14px;">{{ cName }}</div><div style="font-family: var(--font-mono); font-size: 18px; font-weight: 700;">{{ cPct }}</div></div>
    </div>
    <div style="display: flex; flex-direction: column; min-width: 240px; flex: 0 1 300px;"><sc-for list="{{ legend }}" as="l" hint-placeholder-count="15"><button class="pc-leg" onMouseEnter="{{ l.enter }}" onMouseLeave="{{ leave }}" onFocus="{{ l.enter }}" onBlur="{{ leave }}" style="opacity: {{ l.o }};"><span style="width: 12px; height: 12px; background: {{ l.c }}; flex-shrink: 0;"></span><span style="flex: 1; min-width: 0;">{{ l.name }}</span><span style="font-family: var(--font-mono); font-size: 12px;">{{ l.pct }}</span></button></sc-for></div>
  </div>
</section>

<section style="border: 1px solid var(--ink); overflow-x: auto;"><table style="border-collapse: collapse; min-width: 1500px; width: 100%; font-size: 12px;">
  <thead><tr style="background: var(--neutral-100); border-bottom: 1px solid var(--ink);"><th style="position: sticky; left: 0; background: var(--neutral-100); text-align: left; padding: 10px 12px; white-space: nowrap;">Date</th><sc-for list="{{ names }}" as="n" hint-placeholder-count="15"><th style="text-align: right; padding: 10px 10px; font-weight: 700; line-height: 16px;">{{ n }}<br><span style="font-weight: 400; color: var(--text-muted);">(mn)</span></th></sc-for><th style="text-align: right; padding: 10px 12px;">Total<br><span style="font-weight: 400; color: var(--text-muted);">(mn)</span></th></tr></thead>
  <tbody><sc-for list="{{ trs }}" as="r" hint-placeholder-count="5"><tr style="background: {{ r.bg }}; border-top: 1px solid var(--neutral-200);"><td style="position: sticky; left: 0; background: {{ r.bg }}; padding: 10px 12px; font-family: var(--font-mono); white-space: nowrap;"><span style="display: inline-block; width: 8px; height: 8px; background: {{ r.dot }}; margin-right: 8px;"></span>{{ r.date }}</td><sc-for list="{{ r.cells }}" as="c"><td style="text-align: right; padding: 10px; font-family: var(--font-mono); font-weight: {{ c.fw }};">{{ c.v }}</td></sc-for><td style="text-align: right; padding: 10px 12px; font-family: var(--font-mono); font-weight: 700;">{{ r.total }}</td></tr></sc-for></tbody>
</table></section>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.UFT, day: -1, hi: -1 };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const st = this.state; const D = U.sectorDaily(); const N = D.names.length;
    const dayCol = i => `color-mix(in oklch, var(--blue-700) ${100 - i * 18}%, var(--paper))`;
    const tableRows = D => D.dates.map((d, i) => { const v = D.values[i]; const mx = Math.max(...v); return { date: d, dot: dayCol(i), bg: i % 2 ? 'var(--neutral-50)' : 'var(--paper)', total: U.fmt(v.reduce((a, b) => a + b, 0), 2), cells: v.map(x => ({ v: U.fmt(x, 2), fw: x === mx ? 700 : 400 })) }; });
    const col = i => `oklch(${52 + (i % 3) * 9}% 0.14 ${(i * 360 / N + 20) % 360})`;
    const P = (r, a) => [500 / 2 + r * Math.sin(a), 500 / 2 - r * Math.cos(a)];
    const arc = (r0, r1, a0, a1) => { if (a1 - a0 > Math.PI * 2 - 1e-4) a1 = a0 + Math.PI * 2 - 1e-4; const big = a1 - a0 > Math.PI ? 1 : 0; const [x0, y0] = P(r1, a0), [x1, y1] = P(r1, a1), [x2, y2] = P(r0, a1), [x3, y3] = P(r0, a0);
      return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`; };
    const days = st.day < 0 ? [0, 1, 2, 3, 4] : [st.day];
    const arcs = []; days.forEach((di, ri) => { const v = D.values[di]; const tot = v.reduce((a, b) => a + b, 0); let a = 0;
      const outer = st.day < 0 ? 240 - ri * 40 : 240, inner = st.day < 0 ? outer - 36 : 110;
      v.forEach((x, i) => { const sw = x / tot * Math.PI * 2; arcs.push({ d: arc(inner, outer, a, a + sw), c: col(i), o: st.hi < 0 || st.hi === i ? 1 : 0.25, tip: `${D.names[i]} · ${D.dates[di]} · ${U.fmt(x, 2)} mn (${U.fmt(x / tot * 100, 1)}%)`, enter: () => this.setState({ hi: i }) }); a += sw; }); });
    const ref = st.day < 0 ? 0 : st.day; const tot0 = D.values[ref].reduce((a, b) => a + b, 0);
    const legend = D.names.map((n, i) => ({ name: n, c: col(i), pct: U.fmt(D.values[ref][i] / tot0 * 100, 1) + '%', o: st.hi < 0 || st.hi === i ? 1 : 0.45, enter: () => this.setState({ hi: i }) }));
    return { arcs, legend, leave: () => this.setState({ hi: -1 }), cName: st.hi < 0 ? 'Total turnover' : D.names[st.hi], cPct: st.hi < 0 ? U.fmt(tot0, 0) + ' mn' : U.fmt(D.values[ref][st.hi] / tot0 * 100, 1) + '%',
      ringNote: st.day < 0 ? 'Outer ring: ' + D.dates[0] + ' · inner ring: ' + D.dates[4] : 'Showing ' + D.dates[st.day],
      dayTabs: [{ k: -1, label: 'All 5 sessions' }, ...D.dates.map((d, i) => ({ k: i, label: d }))].map((t, i) => ({ label: t.label, sel: st.day === t.k ? 'true' : 'false', bg: st.day === t.k ? 'var(--ink)' : 'var(--paper)', fg: st.day === t.k ? 'var(--paper)' : 'var(--ink)', bl: i ? '1px solid var(--ink)' : '0', onClick: () => this.setState({ day: t.k }) })),
      names: D.names, trs: tableRows(D) };
  }
}
</script>
</body>
</html>
