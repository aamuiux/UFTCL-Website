  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"24d705b6-0bac-43df-a9a6-d08f3e204def\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<title>About — UFTCL<\u002Ftitle>\n<style>@font-face{font-family:'die grotesk a';font-weight:400;font-display:swap;src:url(\"077a0807-07ad-41e4-8397-da2fb2458fce\") format('woff2')}\n@font-face{font-family:'die grotesk a';font-weight:700;font-display:swap;src:url(\"4469e1b8-932f-47cf-badd-99c29a9815a2\") format('woff2')}\n@font-face{font-family:'die grotesk b';font-weight:400;font-display:swap;src:url(\"d31730df-ff48-4561-ad50-3fe2ce9e59f4\") format('woff2')}\n@font-face{font-family:'die grotesk b';font-weight:700;font-display:swap;src:url(\"9f715cb7-c83c-4f83-a0c1-cedacfb42cd7\") format('woff2')}\n/* Die Grotesk alternate R (ss02): font-variant-alternates: styleset(alternate-r) */\n@font-feature-values 'die grotesk a', 'die grotesk b' { @styleset { alternate-r: 2; } }\n@font-face{font-family:'Paper Mono';font-weight:400;font-display:swap;src:url(\"58187168-bad7-40c4-89ed-37f0e5930946\") format('woff2');font-variation-settings:'wght' 415;size-adjust:calc(100% * 13.5 / 14)}\n@font-face{font-family:'Paper Mono';font-weight:700;font-display:swap;src:url(\"58187168-bad7-40c4-89ed-37f0e5930946\") format('woff2');font-variation-settings:'wght' 650;size-adjust:calc(100% * 13.5 / 14)}\n\n/* Base UI Custom — colors.\n * Two layers, both lifted verbatim from mui/base-ui:\n *  1. Demo palette (oklch neutrals + red/green/blue) — the look of every component demo.\n *  2. Docs chrome palette (hsl gray/indigo scales, alpha blacks/whites, accents) — the docs site.\n */\n:root{\n  /* Demo neutrals (Tailwind-neutral oklch values registered in docs/src/css/index.css) */\n  --neutral-50:oklch(98.5% 0 0deg);\n  --neutral-100:oklch(97% 0 0deg);\n  --neutral-200:oklch(92.2% 0 0deg);\n  --neutral-300:oklch(87% 0 0deg);\n  --neutral-400:oklch(70.8% 0 0deg);\n  --neutral-500:oklch(55.6% 0 0deg);\n  --neutral-600:oklch(43.9% 0 0deg);\n  --neutral-700:oklch(37.1% 0 0deg);\n  --neutral-800:oklch(26.9% 0 0deg);\n  --neutral-900:oklch(20.5% 0 0deg);\n  --neutral-950:oklch(14.5% 0 0deg);\n  --white:#fff;\n  --black:#000;\n  --blue-500:oklch(62.3% 0.214 259.815deg);\n  --blue-700:oklch(48.8% 0.243 264.376deg);\n  --blue-800:oklch(42.4% 0.199 265.638deg);\n  --red-400:oklch(70.4% 0.191 22.216deg);\n  --red-700:oklch(50.5% 0.213 27.518deg);\n  --green-400:oklch(79.2% 0.209 151.711deg);\n  --green-700:oklch(52.7% 0.154 150.069deg);\n\n  /* Docs chrome scales: s = surface, c = component, p = primary/placeholder, t = text */\n  --gray-s1:hsl(0deg 0% 99%);\n  --gray-s2:hsl(0deg 0% 97.5%);\n  --gray-c1:hsl(0deg 0% 95.25%);\n  --gray-c2:hsl(0deg 0% 94%);\n  --gray-c3:hsl(0deg 0% 88%);\n  --gray-p1:hsl(0deg 0% 55%);\n  --gray-p2:hsl(0deg 0% 51%);\n  --gray-t1:hsl(0deg 0% 46.4%);\n  --gray-t2:hsl(0deg 0% 18%);\n  --indigo-s1:hsl(204deg 100% 98.75%);\n  --indigo-s2:hsl(198deg 100% 97.5%);\n  --indigo-c1:hsl(204deg 100% 95%);\n  --indigo-c2:hsl(205deg 100% 93.5%);\n  --indigo-c3:hsl(206deg 100% 92.5%);\n  --indigo-p1:hsl(214deg 98% 50%);\n  --indigo-p2:hsl(207deg 96% 48%);\n  --indigo-t1:hsl(221deg 74% 51%);\n  --indigo-t2:hsl(221deg 74% 19.8%);\n  --blackA-1:hsl(0deg 0% 0% / 4%);\n  --blackA-2:hsl(0deg 0% 0% / 8%);\n  --blackA-3:hsl(0deg 0% 0% / 12%);\n  --blackA-4:hsl(0deg 0% 0% / 16%);\n  --blackA-5:hsl(0deg 0% 0% / 24%);\n  --blackA-6:hsl(0deg 0% 0% / 64%);\n  --whiteA-1:hsl(0deg 0% 100% / 4%);\n  --whiteA-2:hsl(0deg 0% 100% / 8%);\n  --whiteA-3:hsl(0deg 0% 100% / 12%);\n  --whiteA-4:hsl(0deg 0% 100% / 16%);\n  --whiteA-5:hsl(0deg 0% 100% / 24%);\n  --whiteA-6:hsl(0deg 0% 100% / 64%);\n  --poppy-t1:hsl(10deg 86% 48%);\n  --blue-t1:hsl(211deg 100% 49%);\n  --green-t1:hsl(156deg 81% 29%);\n  --orange-t1:hsl(14deg 96% 52.5%);\n  --pink-t1:hsl(316deg 84% 51%);\n  --grape-t1:hsl(276deg 66% 54%);\n  --lime-t1:hsl(91deg 64% 38.75%);\n\  0; padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; align-items: start;\">\n  <aside style=\"grid-column: span 1; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px;\">\n    <sc-for list=\"{{ nav }}\" as=\"g\">\n      <div style=\"display: flex; flex-direction: column;\">\n        <div style=\"font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 0 12px 6px;\">{{ g.title }}<\u002Fdiv>\n        <sc-for list=\"{{ g.items }}\" as=\"i\"><a href=\"{{ i.href }}\" style=\"height: 32px; padding: 0 12px; display: flex; align-items: center; background: {{ i.bg }}; color: {{ i.fg }}; border: 1px solid {{ i.bd }};\" style-hover=\"text-decoration: underline;\">{{ i.label }}<\u002Fa><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Faside>\n  <div style=\"grid-column: span 3; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <div style=\"font-size: 13px; color: var(--text-muted);\"><a href=\"Home.dc.html\">Home<\u002Fa> / About / {{ crumb }}<\u002Fdiv>\n      <h1 style=\"margin: 0; font-family: var(--font-sans-b); font-size: 34px; line-height: 43px;\">{{ title }}<\u002Fh1>\n      <div style=\"color: var(--text-muted); max-width: 640px;\">{{ sub }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ is.overview }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"border: 1px solid var(--ink); padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 760px; text-wrap: pretty; line-height: 24px;\">\n          <p style=\"margin: 0;\">UFTCL is a securities brokerage and research platform for the Dhaka Stock Exchange (DSE) and Chittagong Stock Exchange (CSE). It combines live prices, charts, volume price analysis and market depth with online trading and BO account services.<\u002Fp>\n          <p style=\"margin: 0;\">Research tools on this site cover DSEX, DSES and DS30, sector and circuit breaker views, IPO tracking, news effect charts and the stock scanner.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;\">\n          <sc-for list=\"{{ facts }}\" as=\"f\"><div style=\"border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: var(--text-muted);\">{{ f.k }}<\u002Fspan><span style=\"font-size: 18px; font-weight: 700;\">{{ f.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;\">\n          <sc-for list=\"{{ pillars }}\" as=\"p\"><div style=\"border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 6px;\"><b>{{ p.t }}<\u002Fb><span style=\"color: var(--text-muted); text-wrap: pretty;\">{{ p.d }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.team }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px;\">\n        <sc-for list=\"{{ team }}\" as=\"m\">\n          <div style=\"border: 1px solid var(--ink); display: flex; flex-direction: column;\">\n            <div style=\"aspect-ratio: 4 / 3; background: var(--neutral-100); border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);\">Photo<\u002Fdiv>\n            <div style=\"padding: 12px 16px; display: flex; flex-direction: column; gap: 2px;\"><b>{{ m.name }}<\u002Fb><span style=\"color: var(--text-muted);\">{{ m.role }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.trec }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 900px;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;\">\n          <sc-for list=\"{{ certs }}\" as=\"c\"><div style=\"border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 4px;\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: var(--text-muted);\">{{ c.k }}<\u002Fspan><span style=\"font-weight: 700;\">{{ c.v }}<\u002Fspan><span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);\">{{ c.n }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--ink);\">\n          <div style=\"padding: 12px 16px; border-bottom: 1px solid var(--ink); font-weight: 700;\">Compliance documents<\u002Fdiv>\n          <sc-for list=\"{{ docs }}\" as=\"d\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--neutral-200);\"><span>{{ d.name }}<\u002Fspan><a href=\"#\" style=\"display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--ink);\" style-hover=\"background: var(--ink); color: var(--paper);\">View PDF<\u002Fa><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.branches }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n          <div style=\"display: flex; border: 1px solid var(--ink);\"><sc-for list=\"{{ cityTabs }}\" as=\"t\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"font: inherit; height: 30px; padding: 0 12px; border: 0; border-right: 1px solid var(--ink); margin-right: -1px; background: {{ t.bg }}; color: {{ t.fg }}; cursor: pointer;\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--ink); overflow-x: auto;\">\n          <div style=\"min-width: 640px;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 2fr 1.2fr 1fr; background: var(--neutral-50); border-bottom: 1px solid var(--ink); font-size: 12px; color: var(--text-muted);\"><span style=\"padding: 10px 16px;\">Branch<\u002Fspan><span style=\"padding: 10px 16px;\">Address<\u002Fspan><span style=\"padding: 10px 16px;\">Phone<\u002Fspan><span style=\"padding: 10px 16px;\">Hours<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ branches }}\" as=\"b\"><div style=\"display: grid; grid-template-columns: 1fr 2fr 1.2fr 1fr; border-bottom: 1px solid var(--neutral-200);\"><span style=\"padding: 10px 16px; font-weight: 700;\">{{ b.name }}<\u002Fspan><span style=\"padding: 10px 16px;\">{{ b.addr }}<\u002Fspan><span style=\"padding: 10px 16px; font-family: var(--font-mono);\">{{ b.phone }}<\u002Fspan><span style=\"padding: 10px 16px; color: var(--text-muted);\">Sun–Thu, 10 AM – 5 PM<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.careers }}\">\n      <div style=\"border: 1px solid var(--ink); max-width: 900px;\">\n        <div style=\"padding: 12px 16px; border-bottom: 1px solid var(--ink); font-weight: 700;\">Open positions<\u002Fdiv>\n        <sc-for list=\"{{ jobs }}\" as=\"j\"><div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--neutral-200);\"><div style=\"display: flex; flex-direction: column;\"><b>{{ j.t }}<\u002Fb><span style=\"color: var(--text-muted); font-size: 13px;\">{{ j.meta }}<\u002Fspan><\u002Fdiv><a href=\"#apply\" style=\"height: 32px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--ink);\" style-hover=\"background: var(--ink); color: var(--paper);\">Apply<\u002Fa><\u002Fdiv><\u002Fsc-for>\n        <div style=\"padding: 12px 16px; background: var(--neutral-100); font-size: 13px;\">Send your CV to careers@uftcl.com.bd.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.faq }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px; max-width: 800px;\">\n        <sc-for list=\"{{ faq }}\" as=\"g\">\n          <div style=\"border: 1px solid var(--ink);\">\n            <div style=\"padding: 12px 16px; border-bottom: 1px solid var(--ink); font-weight: 700;\">{{ g.title }}<\u002Fdiv>\n            <sc-for list=\"{{ g.items }}\" as=\"q\">\n              <details style=\"border-bottom: 1px solid var(--neutral-200);\">\n                <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px;\"><span>{{ q.q }}<\u002Fspan><svg class=\"uft-plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" style=\"flex-shrink: 0; transition: transform 150ms;\"><path d=\"M8 2v12M2 8h12\"><\u002Fpath><\u002Fsvg><\u002Fsummary>\n                <div style=\"padding: 0 16px 14px; color: var(--text-muted); line-height: 22px; text-wrap: pretty;\">{{ q.a }}<\u002Fdiv>\n              <\u002Fdetails>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.forms }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;\">\n        <sc-for list=\"{{ forms }}\" as=\"f\">\n          <div style=\"border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 12px; justify-content: space-between;\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\"><b>{{ f.t }}<\u002Fb><span style=\"color: var(--text-muted); font-size: 13px;\">{{ f.d }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; align-items: center;\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);\">PDF<\u002Fspan><a href=\"#download\" style=\"display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--ink);\" style-hover=\"background: var(--ink); color: var(--paper);\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"square\"><path d=\"M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10\"><\u002Fpath><\u002Fsvg>Download<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.contact }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 1000px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ contacts }}\" as=\"c\"><div style=\"border: 1px solid var(--ink); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 11px; letter-spacing: 0.08em; color: var(--text-muted);\">{{ c.k }}<\u002Fspan><span style=\"font-family: var(--font-mono);\">{{ c.v }}<\u002Fspan><span style=\"font-size: 13px; color: var(--text-muted);\">{{ c.n }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <form sc-camel-on-submit=\"{{ onSend }}\" style=\"border: 1px solid var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 16px;\">\n          <b style=\"font-size: 16px;\">Send a message<\u002Fb>\n          <x-import component-from-global-scope=\"BaseUICustomDesignSystem_2d9078.Input\" label=\"Name\" hint-size=\"100%,56px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"BaseUICustomDesignSystem_2d9078.Input\" label=\"Email or client code\" hint-size=\"100%,56px\"><\u002Fx-import>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-weight: 700;\">Message<textarea rows=\"5\" style=\"font: inherit; font-weight: 400; border: 1px solid var(--ink); padding: 8px; resize: vertical; outline: none; background: var(--paper); color: var(--ink);\"><\u002Ftextarea><\u002Flabel>\n          <div style=\"display: flex; align-items: center; gap: 12px;\"><button type=\"submit\" style=\"font: inherit; height: 32px; padding: 0 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer;\">Send<\u002Fbutton><span style=\"font-size: 13px; color: var(--text-muted);\">{{ sent }}<\u002Fspan><\u002Fdiv>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.links }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;\">\n        <sc-for list=\"{{ links }}\" as=\"l\">\n          <a href=\"{{ l.href }}\" style=\"border: 1px solid var(--ink); padding: 16px; display: flex; justify-content: space-between; gap: 12px;\" style-hover=\"background: var(--neutral-100);\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px;\"><b>{{ l.t }}<\u002Fb><span style=\"color: var(--text-muted); font-size: 13px;\">{{ l.d }}<\u002Fspan><\u002Fdiv>\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" style=\"flex-shrink: 0;\"><path d=\"M6 3H3v10h10v-3M9 2.5h4.5V7M13.5 2.5 7 9\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fmain>\n<dc-import name=\"Footer\" hint-size=\"100%,320px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { city: 'All', sent: '' };\n  renderVals() {\n    const P = (() => { try { return new URLSearchParams(location.search).get('p') || 'overview'; } catch (e) { return 'overview'; } })();\n    const META = { overview: ['Overview', 'About us', 'Who we are and what the platform offers.'], team: ['Management & team', 'Management & Team', 'The people who run UFTCL.'], trec: ['TREC certificate & compliance', 'TREC & Compliance', 'Exchange membership and regulatory documents.'], branches: ['Branch network', 'Branch Network', 'Find a UFTCL branch near you.'], careers: ['Careers', 'Careers', 'Join the brokerage and research teams.'], faq: ['Frequently asked questions', 'FAQ', 'Answers on accounts, trading and platform tools.'], forms: ['Download forms', 'Download Forms', 'Account, nomination and service request forms.'], contact: ['Contact us', 'Contact Us', 'Reach customer care or send a message.'], links: ['Important links', 'Important Links', 'Regulators, exchanges and depositories.'] };\n    const m = META[P] || META.overview;\n    const grp = [['About us', [['overview', 'Overview'], ['team', 'Management & Team'], ['trec', 'TREC Certificate & Compliance'], ['branches', 'Branch Network'], ['careers', 'Careers']]], ['Help & support', [['faq', 'FAQ'], ['forms', 'Download Forms'], ['contact', 'Contact Us'], ['links', 'Important Links']]]];\n    const nav = grp.map(([title, it]) => ({ title, items: it.map(([k, label]) => ({ label, href: 'About.dc.html?p=' + k, bg: k === P ? 'var(--ink)' : 'transparent', fg: k === P ? 'var(--paper)' : 'var(--ink)', bd: k === P ? 'var(--ink)' : 'transparent' })) }));\n    const is = {}; Object.keys(META).forEach(k => is[k] = k === P);\n    const cities = ['All', 'Dhaka', 'Chattogram', 'Other'];\n    const B = [['Head office', 'Motijheel C/A, Dhaka 1000', '+880 2 9000 001', 'Dhaka'], ['Gulshan', 'Gulshan Avenue, Dhaka 1212', '+880 2 9000 002', 'Dhaka'], ['Banani', 'Banani, Dhaka 1213', '+880 2 9000 003', 'Dhaka'], ['Uttara', 'Uttara Sector 7, Dhaka 1230', '+880 2 9000 004', 'Dhaka'], ['Agrabad', 'Agrabad C/A, Chattogram 4100', '+880 31 900 005', 'Chattogram'], ['GEC Circle', 'GEC Circle, Chattogram 4000', '+880 31 900 006', 'Chattogram'], ['Sylhet', 'Zindabazar, Sylhet 3100', '+880 821 900 007', 'Other'], ['Rajshahi', 'Shaheb Bazar, Rajshahi 6100', '+880 721 900 008', 'Other']];\n    return {\n      nav, is, crumb: m[1], title: m[0], sub: m[2],\n      facts: [{ k: 'EXCHANGES', v: 'DSE and CSE' }, { k: 'INDICES COVERED', v: 'DSEX, DSES, DS30' }, { k: 'TRADING PORTAL', v: 'UFTFAST' }, { k: 'CUSTOMER CARE', v: '10 AM – 5 PM, Sun–Thu' }],\n      pillars: [{ t: 'Research tools', d: 'Charts, VPA, market depth, news effect charts and a stock scanner on one platform.' }, { t: 'Brokerage', d: 'BO account opening, fund deposit and withdrawal, and IPO applications.' }, { t: 'Practice', d: 'UFT Play lets new investors trade with virtual money before using real funds.' }],\n      team: ['Chairman', 'Managing Director', 'Chief Executive Officer', 'Head of Research', 'Head of Trading', 'Head of Compliance', 'Head of Technology', 'Head of Customer Care'].map(r => ({ name: 'Name to be added', role: r })),\n      certs: [{ k: 'DSE TREC', v: 'Trading Right Entitlement Certificate', n: 'TREC No. to be added' }, { k: 'CSE TREC', v: 'Trading Right Entitlement Certificate', n: 'TREC No. to be added' }, { k: 'BSEC', v: 'Stock broker / dealer registration', n: 'Reg. No. to be added' }, { k: 'CDBL', v: 'Depository participant', n: 'DP ID to be added' }],\n      docs: ['TREC certificate, DSE', 'TREC certificate, CSE', 'BSEC registration', 'Annual compliance report', 'Anti money laundering policy', 'Client complaint procedure'].map(name => ({ name })),\n      cityTabs: cities.map(c => ({ label: c, bg: this.state.city === c ? 'var(--ink)' : 'var(--paper)', fg: this.state.city === c ? 'var(--paper)' : 'var(--ink)', onClick: () => this.setState({ city: c }) })),\n      branches: B.filter(b => this.state.city === 'All' || b[3] === this.state.city).map(b => ({ name: b[0], addr: b[1], phone: b[2] })),\n      jobs: [['Equity research analyst', 'Research · Dhaka · Full time'], ['Frontend engineer', 'Technology · Dhaka · Full time'], ['Dealer', 'Trading · Dhaka, Chattogram · Full time'], ['Customer care executive', 'Support · Dhaka · Full time']].map(([t, meta]) => ({ t, meta })),\n      faq: [{ title: 'Accounts', items: [['How do I open a BO account?', 'Select Open BO account in the header, fill in the form and submit your identity and nominee documents at any branch or upload them online.'], ['What documents are needed?', 'A national ID or passport, a passport size photo, a TIN certificate and bank account details. Nominee details are also required.']] }, { title: 'Trading', items: [['What are the trading hours?', 'DSE trades Sunday to Thursday from 10:00 AM to 2:30 PM. The pre-open session starts at 9:30 AM.'], ['What is the circuit breaker?', 'A daily limit on how far a share price can move from yesterday\\'s close. The limit is 10% in either direction.']] }, { title: 'Platform', items: [['What is VPA?', 'Volume price analysis compares traded volume with price movement to show buying and selling pressure.'], ['Can I practice without real money?', 'Yes. UFT Play provides a virtual portfolio for practice trading.']] }].map(g => ({ title: g.title, items: g.items.map(([q, a]) => ({ q, a })) })),\n      forms: [['BO account opening form', 'Individual account'], ['Joint account form', 'Two holders'], ['Nominee change form', 'Update nominee details'], ['Fund withdrawal request', 'Withdraw to a linked bank account'], ['Power of attorney', 'Authorize a representative'], ['Account closure form', 'Close a BO account']].map(([t, d]) => ({ t, d })),\n      contacts: [{ k: 'CUSTOMER CARE HOTLINE', v: '+880 9610 000 000', n: '10 AM – 5 PM, Sun–Thu' }, { k: 'EMAIL', v: 'support@uftcl.com.bd', n: 'Replies within one working day' }, { k: 'HEAD OFFICE', v: 'Motijheel C/A, Dhaka 1000', n: 'Address to be confirmed' }],\n      links: [['Bangladesh Securities and Exchange Commission', 'Market regulator', 'https://www.sec.gov.bd/'], ['Dhaka Stock Exchange', 'DSE', 'https://www.dsebd.org/'], ['Chittagong Stock Exchange', 'CSE', 'https://www.cse.com.bd/'], ['Central Depository Bangladesh', 'CDBL', 'https://www.cdbl.com.bd/'], ['Bangladesh Bank', 'Central bank', 'https://www.bb.org.bd/'], ['National Board of Revenue', 'Tax', 'https://nbr.gov.bd/']].map(([t, d, href]) => ({ t, d, href })),\n      sent: this.state.sent, onSend: e => { e.preventDefault(); this.setState({ sent: 'Message sent.' }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
