<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>52 week price range — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
.tl-ctl { font: inherit; font-size: 13px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.tl-btn { font: inherit; font-size: 13px; font-weight: 700; height: 36px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tl-btn:hover { background: var(--ink); color: var(--paper); }

.wr-cols { column-width: 340px; column-gap: 16px; }
.wr-card { break-inside: avoid; border: 1px solid var(--ink); margin-bottom: 16px; }
.wr-row { display: grid; grid-template-columns: minmax(0, 1fr) 62px 62px 62px; gap: 0 8px; align-items: center; padding: 7px 12px 11px; position: relative; font-size: 13px; border-top: 1px solid var(--neutral-200); }

</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="tools" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
<section style="display: flex; flex-direction: column; gap: 4px;">
  <h1 style="margin: 0; font-family: var(--font-sans-b); font-size: 34px; line-height: 43px;">52 week price range</h1>
  <div style="color: var(--text-muted);">Lowest, last and highest price of each stock over the last 52 weeks, grouped by sector or category.</div>
</section>

<section style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--ink); padding: 8px 12px;">
  <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;">Group by<select class="tl-ctl" value="{{ group }}" onChange="{{ onGroup }}"><sc-for list="{{ groupOpts }}" as="o" hint-placeholder-count="2"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></label>
  <div role="tablist" aria-label="Filter" style="display: flex; border: 1px solid var(--ink);"><sc-for list="{{ filters }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.onClick }}" style="font: inherit; font-size: 13px; height: 34px; padding: 0 12px; border: 0; border-left: {{ t.bl }}; background: {{ t.bg }}; color: {{ t.fg }}; cursor: pointer;">{{ t.label }}</button></sc-for></div>
  <input class="tl-ctl" type="search" placeholder="Search stock" aria-label="Search stock" value="{{ q }}" onInput="{{ onQ }}" style="width: 200px; max-width: 100%;">
  <span style="margin-left: auto; font-size: 13px; color: var(--text-muted);">{{ count }} stocks</span>
</section>
<section class="wr-cols">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6"><div class="wr-card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--neutral-100); border-bottom: 1px solid var(--ink);"><b>{{ g.name }}</b><span style="font-size: 12px; color: var(--text-muted);">{{ g.n }}</span></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 62px 62px 62px; gap: 0 8px; padding: 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase;"><span>Instrument</span><span style="text-align: right;">Min</span><span style="text-align: right;">LTP</span><span style="text-align: right;">Max</span></div>
    <sc-for list="{{ g.rows }}" as="r"><div class="wr-row"><a href="{{ r.href }}" style="font-weight: 700; display: flex; gap: 6px; align-items: baseline;">{{ r.code }}<span style="font-size: 10px; font-weight: 700; color: {{ r.tagC }};">{{ r.tag }}</span></a><span style="text-align: right; font-family: var(--font-mono);">{{ r.min }}</span><b style="text-align: right; font-family: var(--font-mono);">{{ r.ltp }}</b><span style="text-align: right; font-family: var(--font-mono);">{{ r.max }}</span>
      <span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; background: var(--neutral-200);"><span style="position: absolute; top: -2px; width: 3px; height: 7px; background: var(--ink); left: {{ r.pos }};"></span></span></div></sc-for>
  </div></sc-for>
</section>
<sc-if value="{{ none }}"><div style="border: 1px solid var(--ink); padding: 32px 16px; text-align: center; color: var(--text-muted);">No stock matches your filters.</div></sc-if>

</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.UFT, group: 'sector', filter: 'all', q: '' };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const st = this.state; const f = v => U.fmt(v, 1); const q = st.q.trim().toUpperCase();
    const pos = s => Math.max(0, Math.min(1, (s.ltp - s.w52l) / ((s.w52h - s.w52l) || 1)));
    const keep = U.stocks.filter(s => (!q || s.code.includes(q)) && (st.filter === 'all' || (st.filter === 'high' ? pos(s) >= 0.67 : pos(s) <= 0.33)));
    const key = st.group === 'cat' ? s => 'Category ' + s.cat : s => s.sector;
    const by = {}; keep.forEach(s => (by[key(s)] = by[key(s)] || []).push(s));
    const groups = Object.keys(by).sort((a, b) => a.localeCompare(b)).map(name => ({ name, n: by[name].length + ' stocks', rows: by[name].sort((a, b) => a.code.localeCompare(b.code)).map(s => { const p = pos(s);
      return { code: s.code, href: U.href('Stock Chart', { symbol: s.code }), min: f(s.w52l), ltp: f(s.ltp), max: f(s.w52h), pos: `calc(${(p * 100).toFixed(1)}% - 1.5px)`, tag: p >= 0.67 ? 'NEAR HIGH' : p <= 0.33 ? 'NEAR LOW' : '', tagC: p >= 0.67 ? 'var(--green-700)' : 'var(--red-700)' }; }) }));
    const F = [['all', 'All'], ['high', 'Upper third of range'], ['low', 'Lower third of range']];
    return { groups, none: groups.length === 0, count: keep.length, q: st.q, onQ: e => this.setState({ q: e.target.value }), group: st.group, onGroup: e => this.setState({ group: e.target.value }),
      groupOpts: [{ v: 'sector', l: 'Sector' }, { v: 'cat', l: 'Category' }],
      filters: F.map(([k, l], i) => ({ label: l, sel: st.filter === k ? 'true' : 'false', bg: st.filter === k ? 'var(--ink)' : 'var(--paper)', fg: st.filter === k ? 'var(--paper)' : 'var(--ink)', bl: i ? '1px solid var(--ink)' : '0', onClick: () => this.setState({ filter: k }) })) };
  }
}
</script>
</body>
</html>
