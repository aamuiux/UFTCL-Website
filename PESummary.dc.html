<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
</helmet>
<section data-screen-label="PE summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); border: 1px solid var(--ink); font-family: var(--font-sans); color: var(--ink); font-size: 14px;">
  <div style="padding: 20px 24px; border-right: 1px solid var(--neutral-300); display: flex; flex-direction: column; justify-content: center; gap: 6px;">
    <span style="font-family: var(--font-sans-b); font-size: 26px; line-height: 32px; font-weight: 700; text-transform: uppercase;">{{ title }}</span>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted);"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--red-700);"></span><b style="color: var(--red-700);">Closed</b> Updated: 2:10 pm 8/11</span>
  </div>
  <div style="padding: 16px 24px; border-right: 1px solid var(--neutral-300); display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; align-content: center;">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4"><div style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: var(--text-muted);">{{ s.label }}</span><span style="font-family: var(--font-mono); font-size: 18px; font-weight: 700;">{{ s.value }}</span></div></sc-for>
  </div>
  <div style="padding: 16px 24px; display: flex; align-items: center; gap: 20px;">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 28px; height: 28px; border: 1px solid var(--green-700); color: var(--green-700); border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 2l5 8H1z"></path></svg></span><div style="display: flex; flex-direction: column;"><span style="font-size: 11px; color: var(--text-muted);">(+) PE</span><b style="font-family: var(--font-mono); font-size: 20px; color: var(--green-700);">{{ pos }}</b></div></div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 28px; height: 28px; border: 1px solid var(--red-700); color: var(--red-700); border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6 10L1 2h10z"></path></svg></span><div style="display: flex; flex-direction: column;"><span style="font-size: 11px; color: var(--text-muted);">(-) PE</span><b style="font-family: var(--font-mono); font-size: 20px; color: var(--red-700);">{{ neg }}</b></div></div>
      </div>
      <div style="display: flex; height: 16px; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--paper);"><div style="width: {{ posW }}; background: var(--green-700); display: flex; align-items: center; justify-content: center;">{{ pos }}</div><div style="flex: 1; background: var(--red-700); display: flex; align-items: center; justify-content: center;">{{ neg }}</div></div>
    </div>
    <svg viewBox="0 0 40 40" width="84" height="84" aria-label="Positive vs negative PE"><sc-for list="{{ pie }}" as="s"><path d="{{ s.d }}" fill="{{ s.c }}"></path></sc-for></svg>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:130},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Market PE&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ready: !!window.UFT };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const T = U.pe.total; const IN = U.fmtIN; const tot = T.pos + T.neg || 1;
    const pie = (() => { const cx = 20, cy = 20, R = 19; const parts = [[T.pos, 'var(--green-700)'], [T.neg, 'var(--red-700)']]; let a0 = -Math.PI / 2; return parts.map(([v, c]) => { const a1 = a0 + v / tot * 2 * Math.PI; const P = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)]; const [x0, y0] = P(a0), [x1, y1] = P(a1); const d = `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`; a0 = a1; return { d, c }; }); })();
    return { title: this.props.title || 'Market PE', stats: [['Market PE', U.fmt(T.pe)], ['Market weighted PE', U.fmt(T.wpe)], ['Market capital', IN(T.mcap) + ' mn'], ['Annual earning', IN(T.earn) + ' mn']].map(([label, value]) => ({ label, value })), pos: T.pos, neg: T.neg, posW: (T.pos / tot * 100) + '%', pie };
  }
}
</script>
</body>
</html>
