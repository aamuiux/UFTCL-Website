<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Multiple Charts — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
.mc-btn { font: inherit; font-size: 13px; font-weight: 700; height: 40px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.mc-btn:hover { background: var(--ink); color: var(--paper); }
.mc-icon { width: 38px; height: 28px; box-sizing: border-box; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; padding: 3px; display: inline-flex; }
.mc-icon:hover { background: var(--neutral-100); }
@media (max-width: 760px) { .mc-grid { grid-template-columns: 1fr !important; grid-template-rows: none !important; height: auto !important; } .mc-grid > div { grid-area: auto !important; height: 420px; } }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="market" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">

  <sc-if value="{{ bannerOn }}"><div role="note" data-screen-label="Info banner" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: hsl(32deg 88% 52%); color: var(--ink); font-size: 14px;"><span>In multiple charts you can view several instruments in the same or different time intervals. Pick a layout, then choose an instrument and time interval for each chart.</span><button onClick="{{ onBanner }}" aria-label="Dismiss" style="flex-shrink: 0; width: 28px; height: 28px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 20px; line-height: 1;">×</button></div></sc-if>

  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; position: relative;" data-screen-label="Layout bar">
    <span style="font-size: 13px; color: var(--text-muted);">{{ countLabel }}</span>
    <button class="mc-btn" onClick="{{ onMenu }}" aria-haspopup="true" aria-expanded="{{ menuStr }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5.500" height="5.500"></rect><rect x="9" y="1.5" width="5.500" height="5.500"></rect><rect x="1.5" y="9" width="5.500" height="5.500"></rect><rect x="9" y="9" width="5.500" height="5.500"></rect></svg>Layout</button>
    <sc-if value="{{ menuOpen }}"><div>
      <div onClick="{{ onMenu }}" style="position: fixed; inset: 0; z-index: 40;"></div>
      <div role="dialog" aria-label="Chart layout" style="position: absolute; right: 0; top: 46px; z-index: 41; width: 340px; max-width: calc(100vw - 32px); background: var(--paper); border: 1px solid var(--ink);">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6"><div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--neutral-200);">
          <span style="width: 18px; font-weight: 700; font-size: 14px;">{{ g.n }}.</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3"><button class="mc-icon" onClick="{{ it.onPick }}" aria-label="{{ it.label }}" title="{{ it.label }}" style="background: {{ it.bg }}; border-color: {{ it.bd }};"><svg viewBox="0 0 24 18" width="100%" height="100%" aria-hidden="true"><sc-for list="{{ it.rects }}" as="r" hint-placeholder-count="3"><rect x="{{ r.x }}" y="{{ r.y }}" width="{{ r.w }}" height="{{ r.h }}" fill="none" stroke="{{ it.st }}" stroke-width="1.200"></rect></sc-for></svg></button></sc-for></div>
        </div></sc-for>
      </div>
    </div></sc-if>
  </div>

  <div class="mc-grid" data-screen-label="Charts" style="display: grid; gap: 12px; height: {{ gridH }}; grid-template-columns: {{ gCols }}; grid-template-rows: {{ gRows }};">
    <sc-if value="{{ show1 }}"><div style="grid-area: {{ a1 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="DSEX" tf="D" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
    <sc-if value="{{ show2 }}"><div style="grid-area: {{ a2 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="GP" tf="D" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
    <sc-if value="{{ show3 }}"><div style="grid-area: {{ a3 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="BATBC" tf="W" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
    <sc-if value="{{ show4 }}"><div style="grid-area: {{ a4 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="SQURPHARMA" tf="D" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
    <sc-if value="{{ show5 }}"><div style="grid-area: {{ a5 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="BRACBANK" tf="M" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
    <sc-if value="{{ show6 }}"><div style="grid-area: {{ a6 }}; min-width: 0; min-height: 0; display: grid;"><dc-import name="ChartPane" mode="compact" code="ROBI" tf="D" sync="0" height="100%" hint-size="100%,420px"></dc-import></div></sc-if>
  </div>

  <dc-import name="SymbolIndex" page="Technical Chart" hint-size="100%,120px"></dc-import>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // every layout is a matrix of pane letters; a letter repeated across cells spans them
  layouts = [
    [['a']],
    [['a', 'b']], [['a'], ['b']],
    [['a'], ['b'], ['c']], [['a', 'b', 'c']], [['a', 'b'], ['a', 'c']], [['a', 'a'], ['b', 'c']], [['a', 'b'], ['c', 'b']], [['a', 'b'], ['c', 'c']],
    [['a', 'b'], ['c', 'd']], [['a', 'b', 'c', 'd']], [['a'], ['b'], ['c'], ['d']], [['a', 'b'], ['a', 'c'], ['a', 'd']], [['a', 'a', 'a'], ['b', 'c', 'd']], [['b', 'a'], ['c', 'a'], ['d', 'a']],
    [['a', 'a', 'b', 'b', 'c', 'c'], ['d', 'd', 'd', 'e', 'e', 'e']], [['a', 'b', 'c'], ['a', 'd', 'e']],
    [['a', 'b', 'c'], ['d', 'e', 'f']], [['a', 'b'], ['c', 'd'], ['e', 'f']],
  ];
  state = { ready: !!window.UFT, layout: 9, menu: false, banner: true };
  readStore(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  writeStore(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  componentDidMount() {
    if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50);
    const l = this.readStore('uftcl.multi.layout'); if (Number.isInteger(l) && l >= 0 && l < this.layouts.length) this.setState({ layout: l });
    if (this.readStore('uftcl.multi.banner') === false) this.setState({ banner: false });
    this.onKey = e => { if (e.key === 'Escape') this.setState({ menu: false }); }; window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { clearInterval(this.p); window.removeEventListener('keydown', this.onKey); }
  count(m) { return new Set(m.flat()).size; }
  renderVals() {
    const st = this.state; const m = this.layouts[st.layout]; const rows = m.length, cols = m[0].length; const letters = ['a', 'b', 'c', 'd', 'e', 'f'];
    const area = L => { let r0 = 99, r1 = -1, c0 = 99, c1 = -1; m.forEach((row, r) => row.forEach((x, c) => { if (x === L) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); } })); return r1 < 0 ? 'auto' : `${r0 + 1} / ${c0 + 1} / ${r1 + 2} / ${c1 + 2}`; };
    const n = this.count(m);
    const out = { bannerOn: st.banner, onBanner: () => { this.writeStore('uftcl.multi.banner', false); this.setState({ banner: false }); },
      menuOpen: st.menu, menuStr: st.menu ? 'true' : 'false', onMenu: () => this.setState(s => ({ menu: !s.menu })), countLabel: `${n} chart${n > 1 ? 's' : ''}`,
      gCols: `repeat(${cols}, minmax(0, 1fr))`, gRows: `repeat(${rows}, minmax(0, 1fr))`, gridH: (rows === 1 ? 640 : rows === 2 ? 860 : rows * 330) + 'px' };
    letters.forEach((L, i) => { out['show' + (i + 1)] = m.some(row => row.includes(L)); out['a' + (i + 1)] = area(L); });
    const groups = [1, 2, 3, 4, 5, 6].map(k => ({ n: k, items: this.layouts.map((lm, idx) => ({ lm, idx })).filter(x => this.count(x.lm) === k).map(({ lm, idx }) => {
      const R = lm.length, C = lm[0].length, W = 24, H = 18; const on = idx === st.layout; const seen = {}; const rects = [];
      lm.forEach((row, r) => row.forEach((L, c) => { if (seen[L]) return; seen[L] = 1; let r1 = r, c1 = c; lm.forEach((rr, r2) => rr.forEach((x, c2) => { if (x === L) { r1 = Math.max(r1, r2); c1 = Math.max(c1, c2); } })); rects.push({ x: (c * W / C + 1).toFixed(1), y: (r * H / R + 1).toFixed(1), w: ((c1 - c + 1) * W / C - 2).toFixed(1), h: ((r1 - r + 1) * H / R - 2).toFixed(1) }); }));
      return { rects, label: `${k} chart layout`, bg: on ? 'var(--ink)' : 'var(--paper)', bd: 'var(--ink)', st: on ? 'var(--paper)' : 'var(--ink)', onPick: () => { this.writeStore('uftcl.multi.layout', idx); this.setState({ layout: idx, menu: false }); } }; }) }));
    out.groups = groups;
    return out;
  }
}
</script>
</body>
</html>
