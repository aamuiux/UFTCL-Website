<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Chart Gallery — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
.cg-l1s { display: flex; flex-wrap: wrap; gap: 0 8px; border-bottom: 1px solid var(--neutral-300); }
.cg-l1 { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 16px 11px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: transparent; color: var(--text-muted); cursor: pointer; text-decoration: none; }
.cg-l1:hover { color: var(--ink); }
.cg-l1[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.cg-sel { font: inherit; font-size: 13px; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.cg-chip { font: inherit; font-size: 13px; font-weight: 600; height: 34px; padding: 0 14px; border: 1px solid var(--neutral-400); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.cg-chip:hover { border-color: var(--ink); }
.cg-chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start; }
.cg-lbl { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="market" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
<section style="display: flex; flex-direction: column; gap: 4px;">
  <h1 style="margin: 0; font-family: var(--font-sans-b); font-size: 34px; line-height: 43px;">{{ pageTitle }}</h1>
  <div style="color: var(--text-muted); max-width: 820px;">{{ pageDesc }}</div>
</section>
<div role="tablist" class="cg-l1s"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><a role="tab" class="cg-l1" href="{{ t.href }}" aria-selected="{{ t.sel }}">{{ t.label }}</a></sc-for></div>

<section aria-label="Chart settings" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; border: 1px solid var(--ink); padding: 10px 14px; background: var(--neutral-50);">
  <sc-if value="{{ isMtf }}"><label class="cg-lbl">Symbol<select class="cg-sel" aria-label="Symbol" value="{{ sym }}" onChange="{{ onSym }}" style="font-weight: 700; min-width: 140px;"><sc-for list="{{ symOpts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">{{ o }}</option></sc-for></select></label></sc-if>
  <label class="cg-lbl">Range<select class="cg-sel" aria-label="Range" value="{{ range }}" onChange="{{ onRange }}"><option value="3M">3 months</option><option value="6M">6 months</option><option value="1Y">1 year</option></select></label>
  <label class="cg-lbl">Type<select class="cg-sel" aria-label="Chart type" value="{{ type }}" onChange="{{ onType }}"><option value="candle">Candle</option><option value="line">Line</option></select></label>
  <div role="group" aria-label="Overlays and indicators" style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3"><button class="cg-chip" aria-pressed="{{ t.on }}" onClick="{{ t.onClick }}">{{ t.label }}</button></sc-for></div>
  <span style="font-size: 12px; color: var(--text-muted); margin-left: auto;">{{ note }}</span>
</section>

<sc-if value="{{ isSector }}"><section class="cg-grid" aria-label="Sector charts">
    <dc-import name="GalleryChart" sector="Bank" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Cement" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Ceramics" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Engineering" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Financial Institutions" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Food &amp; Allied" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Fuel &amp; Power" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Insurance" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="IT Sector" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Miscellaneous" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Mutual Funds" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Pharmaceuticals &amp; Chemicals" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Tannery" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Telecommunication" tf="D" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" sector="Textile" tf="D" hint-size="100%,620px"></dc-import>
</section></sc-if>
<sc-if value="{{ isCustom }}"><section class="cg-grid" aria-label="Custom charts">
    <dc-import name="GalleryChart" pick="1" code="DS30" tf="D" skey="c0" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" pick="1" code="DSEX" tf="D" skey="c1" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" pick="1" code="GP" tf="D" skey="c2" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" pick="1" code="" tf="D" skey="c3" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" pick="1" code="" tf="D" skey="c4" hint-size="100%,620px"></dc-import>
    <dc-import name="GalleryChart" pick="1" code="" tf="D" skey="c5" hint-size="100%,620px"></dc-import>
</section></sc-if>
<sc-if value="{{ isMtf }}"><section class="cg-grid" aria-label="Multi time frame charts">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">1 Minute</div><dc-import name="GalleryChart" follow="1" tf="1m" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">5 Minutes</div><dc-import name="GalleryChart" follow="1" tf="5m" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">15 Minutes</div><dc-import name="GalleryChart" follow="1" tf="15m" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">30 Minutes</div><dc-import name="GalleryChart" follow="1" tf="30m" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">1 Hour</div><dc-import name="GalleryChart" follow="1" tf="1h" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">4 Hours</div><dc-import name="GalleryChart" follow="1" tf="4h" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">Daily</div><dc-import name="GalleryChart" follow="1" tf="D" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">Weekly</div><dc-import name="GalleryChart" follow="1" tf="W" hint-size="100%,620px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted);">Monthly</div><dc-import name="GalleryChart" follow="1" tf="M" hint-size="100%,620px"></dc-import></div>
</section></sc-if>

<sc-if value="{{ isMtf }}"><dc-import name="SymbolIndex" page="Chart Gallery" hint-size="100%,120px"></dc-import></sc-if>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GKEY = 'uftcl.gal';
const DEF = { range: '3M', type: 'candle', ema: true, ma: true, macd: true, sym: 'DSEX' };
const G = { sector: ['Sector Chart Gallery', 'Every sector as one index chart, side by side, so you can see which sectors lead and which lag.', 'Charts are built from the average of each sector\'s stocks.'],
  custom: ['Custom Chart Gallery', 'Pick up to six instruments and compare their charts in one view. Your picks are saved in this browser.', 'Use the dropdown above each chart to change it.'],
  mtf: ['MTF Chart Gallery', 'One instrument across nine time frames, from one minute to one month.', 'Intraday time frames use sample data in this preview.'] };
class Component extends DCLogic {
  state = { ready: !!window.UFT, set: null };
  componentDidMount() { let s = { ...DEF }; try { s = { ...DEF, ...(JSON.parse(localStorage.getItem(GKEY) || 'null') || {}) }; } catch (e) { /* ignore */ }
    const q = window.UFT ? window.UFT.param('symbol', '') : ''; if (q) s.sym = q; this.setState({ set: s }); if (q) setTimeout(() => window.dispatchEvent(new CustomEvent('uft-gallery', { detail: s })), 300);
    if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  apply(patch) { const s = { ...(this.state.set || DEF), ...patch }; this.setState({ set: s }); try { localStorage.setItem(GKEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ } window.dispatchEvent(new CustomEvent('uft-gallery', { detail: s })); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const g = ['sector', 'custom', 'mtf'].includes(U.param('g', '')) ? U.param('g', '') : U.param('symbol', '') ? 'mtf' : 'sector'; const S = this.state.set || DEF; const T = G[g];
    const tog = (key, label) => ({ label, on: S[key] ? 'true' : 'false', onClick: () => this.apply({ [key]: !S[key] }) });
    return { pageTitle: T[0], pageDesc: T[1], note: T[2], isSector: g === 'sector', isCustom: g === 'custom', isMtf: g === 'mtf',
      tabs: [['sector', 'Sector'], ['custom', 'Custom'], ['mtf', 'MTF']].map(([k, l]) => ({ label: l, sel: g === k ? 'true' : 'false', href: U.href('Chart Gallery', { g: k }) })),
      range: S.range, onRange: e => this.apply({ range: e.target.value }), type: S.type, onType: e => this.apply({ type: e.target.value }),
      toggles: [tog('ema', 'EMA (50)'), tog('ma', 'MA (20)'), tog('macd', 'MACD')], sym: S.sym, symOpts: [...Object.keys(U.indices), ...U.symbols], onSym: e => this.apply({ sym: e.target.value }) };
  }
}
</script>
</body>
</html>
