<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Compare Sector PE — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="market" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 24px;">
  <dc-import name="PETabs" active="Compare Sector PE" hint-size="100%,40px"></dc-import>
  <dc-import name="PESummary" title="Compare Sector PE" hint-size="100%,130px"></dc-import>

  <section data-screen-label="Compare sector PE" style="border: 1px solid var(--ink);">
    <div style="padding: 12px 16px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 12px;"><div style="display: flex; flex-direction: column;"><b style="font-size: 18px;">Compare sector PE</b><span style="font-size: 12px; color: var(--text-muted);">Click a column title to sort. Bars show each sector's share of total market capital.</span></div><dc-import name="TableSettings" skey="comparesector" cols='[["name","Sector"],["pe","PE"],["wpe","Weighted PE"],["mcap","Market capital (mn)"],["earn","Annualized earning (mn)"],["weight","Total market capital weight"]]' locked='["name"]' hint-size="36px,36px"></dc-import></div>
    <div style="overflow-x: auto;"><div style="min-width: {{ minW }}px; font-size: {{ fs }}px;">
      <div style="display: grid; grid-template-columns: {{ gridCols }}; background: var(--neutral-100); border-bottom: 1px solid var(--ink); font-size: {{ fsHead }}px;">
        <sc-for list="{{ heads }}" as="h"><button onClick="{{ h.onClick }}" style="font: inherit; font-size: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; text-align: {{ h.align }}; border: 0; background: transparent; color: var(--ink); cursor: pointer; height: {{ headH }}px; padding: 0 12px;">{{ h.label }} {{ h.arrow }}</button></sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r">
        <div style="display: grid; grid-template-columns: {{ gridCols }}; align-items: center; min-height: {{ rowH }}px; border-bottom: 1px solid var(--neutral-200); background: {{ r.zebra }};" style-hover="background: var(--neutral-100);">
          <sc-for list="{{ r.cells }}" as="c"><div style="padding: 0 12px; min-width: 0; text-align: {{ c.al }}; font-family: {{ c.ff }}; font-weight: {{ c.fw }}; color: {{ c.color }};">
            <sc-if value="{{ c.isText }}">{{ c.v }}</sc-if>
            <sc-if value="{{ c.isLink }}"><a href="{{ c.href }}" style="font-weight: 700;">{{ c.v }}</a></sc-if>
            <sc-if value="{{ c.isBar }}"><div style="display: flex; align-items: center; gap: 8px;"><div style="flex: 1; height: 8px; background: var(--neutral-100);"><div style="height: 8px; width: {{ c.w }}; background: var(--ink);"></div></div><span style="font-family: var(--font-mono); width: 40px; text-align: right;">{{ c.v }}</span></div></sc-if>
          </div></sc-for>
        </div>
      </sc-for>
      <div style="display: grid; grid-template-columns: {{ gridCols }}; align-items: center; min-height: {{ rowH }}px; border-top: 1px solid var(--ink); font-weight: 700; background: var(--neutral-100);">
        <sc-for list="{{ totals }}" as="c"><div style="padding: 0 12px; min-width: 0; text-align: {{ c.al }}; font-family: {{ c.ff }};">{{ c.v }}</div></sc-for>
      </div>
    </div></div>
  </section>

  <dc-import name="SymbolIndex" page="Market Watch" hint-size="100%,120px"></dc-import>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ts: null, ready: !!window.UFT, sort: { k: 'name', d: 1 } };
  componentDidMount() { this.tsL = e => { const d = e.detail || {}; if (d.skey === 'comparesector') this.setState({ ts: { hidden: d.hidden, compact: d.compact, fs: d.fs } }); }; window.addEventListener('uft-table-settings', this.tsL); if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); window.removeEventListener('uft-table-settings', this.tsL); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const st = this.state; const { fmt } = U; const IN = U.fmtIN; const T = U.pe.total; const V = U.tsView(st.ts || U.tsLoad('comparesector'));
    const COLS = [['name', 'Sector', 'left'], ['pe', 'PE', 'right'], ['wpe', 'Weighted PE', 'right'], ['mcap', 'Market capital (mn)', 'right'], ['earn', 'Annualized earning (mn)', 'right'], ['weight', 'Total market capital weight', 'left']];
    const list = U.pe.sectors.slice().sort((a, b) => { const x = a[st.sort.k], y = b[st.sort.k]; const c = typeof x === 'string' ? x.localeCompare(y) : x - y; return c * st.sort.d; });
    const maxW = Math.max(...list.map(g => g.weight)) || 1;
    const wcols = { name: '1.6fr', pe: '1fr', wpe: '1fr', mcap: '1fr', earn: '1fr', weight: '1.3fr' }; const visC = COLS.filter(c => V.show(c[0]));
    const heads = visC.map(([k, label, align]) => ({ label, align, arrow: st.sort.k === k ? (st.sort.d === 1 ? '▲' : '▼') : '', onClick: () => this.setState(s => ({ sort: { k, d: s.sort.k === k ? -s.sort.d : (k === 'name' ? 1 : -1) } })) }));
    const mono = (v, extra) => ({ isText: true, v, al: 'right', ff: 'var(--font-mono)', fw: 400, color: 'var(--ink)', ...(extra || {}) });
    const rows = list.map((g, i) => { const cell = { name: { isLink: true, v: g.name, href: U.href('Sector PE Ratio'), al: 'left', ff: 'var(--font-sans)', fw: 400, color: 'var(--ink)' }, pe: mono(fmt(g.pe)), wpe: mono(fmt(g.wpe)), mcap: mono(IN(g.mcap)), earn: mono(IN(g.earn), { color: g.earn < 0 ? 'var(--red-700)' : 'var(--ink)' }), weight: { isBar: true, v: fmt(g.weight, 2), w: (g.weight / maxW * 100) + '%', al: 'left', ff: 'var(--font-sans)', fw: 400, color: 'var(--ink)' } };
      return { zebra: i % 2 ? 'var(--neutral-50)' : 'transparent', cells: visC.map(c => cell[c[0]]) }; });
    const tot = { name: { v: 'Market', al: 'left', ff: 'var(--font-sans)' }, pe: { v: fmt(T.pe), al: 'right', ff: 'var(--font-mono)' }, wpe: { v: fmt(T.wpe), al: 'right', ff: 'var(--font-mono)' }, mcap: { v: IN(T.mcap), al: 'right', ff: 'var(--font-mono)' }, earn: { v: IN(T.earn), al: 'right', ff: 'var(--font-mono)' }, weight: { v: '1.00', al: 'left', ff: 'var(--font-mono)' } };
    return { heads, rows, totals: visC.map(c => tot[c[0]]), gridCols: visC.map(c => wcols[c[0]] === '1.6fr' ? 'minmax(200px, 1.6fr)' : c[0] === 'weight' ? 'minmax(180px, 1.3fr)' : 'minmax(120px, 1fr)').join(' '), minW: Math.max(400, visC.length * 140), fs: V.fs, fsHead: V.fsHead, rowH: V.rowH, headH: V.headH };
  }
}
</script>
</body>
</html>
