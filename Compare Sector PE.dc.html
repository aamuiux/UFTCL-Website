<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Compare Sector PE — UFTCL</title>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/_ds_bundle.js"></script>
<script src="uftcl-data.js"></script>
<style>
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--blue-700); }
</style>
</helmet>
<div style="min-height: 100vh; font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--paper);">
<dc-import name="Header" active="market" hint-size="100%,140px"></dc-import>
<main style="padding: 24px; display: flex; flex-direction: column; gap: 24px;">
  <dc-import name="PETabs" active="Compare Sector PE" hint-size="100%,40px"></dc-import>
  <dc-import name="PESummary" title="Compare Sector PE" hint-size="100%,130px"></dc-import>

  <section data-screen-label="Compare sector PE" style="border: 1px solid var(--ink);">
    <div style="padding: 12px 16px; border-bottom: 1px solid var(--ink); display: flex; flex-direction: column;"><b style="font-size: 18px;">Compare sector PE</b><span style="font-size: 12px; color: var(--text-muted);">Click a column title to sort. Bars show each sector's share of total market capital.</span></div>
    <div style="overflow-x: auto;"><div style="min-width: 860px;">
      <div style="display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(120px, 1fr)) minmax(180px, 1.3fr); background: var(--neutral-100); border-bottom: 1px solid var(--ink); font-size: 12px;">
        <sc-for list="{{ heads }}" as="h"><button onClick="{{ h.onClick }}" style="font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; text-align: {{ h.align }}; border: 0; background: transparent; color: var(--ink); cursor: pointer; height: 40px; padding: 0 12px;">{{ h.label }} {{ h.arrow }}</button></sc-for>
      </div>
      <sc-for list="{{ rows }}" as="r">
        <div style="display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(120px, 1fr)) minmax(180px, 1.3fr); align-items: center; min-height: 40px; border-bottom: 1px solid var(--neutral-200); background: {{ r.zebra }};" style-hover="background: var(--neutral-100);">
          <a href="{{ r.href }}" style="padding: 0 12px; font-weight: 700;">{{ r.name }}</a>
          <span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ r.pe }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ r.wpe }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ r.mcap }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono); color: {{ r.earnColor }};">{{ r.earn }}</span>
          <div style="display: flex; align-items: center; gap: 8px; padding: 0 12px;"><div style="flex: 1; height: 8px; background: var(--neutral-100);"><div style="height: 8px; width: {{ r.barW }}; background: var(--ink);"></div></div><span style="font-family: var(--font-mono); font-size: 13px; width: 40px; text-align: right;">{{ r.weight }}</span></div>
        </div>
      </sc-for>
      <div style="display: grid; grid-template-columns: minmax(200px, 1.6fr) repeat(4, minmax(120px, 1fr)) minmax(180px, 1.3fr); align-items: center; min-height: 44px; border-top: 1px solid var(--ink); font-weight: 700; background: var(--neutral-100);"><span style="padding: 0 12px;">Market</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ total.pe }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ total.wpe }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ total.mcap }}</span><span style="text-align: right; padding: 0 12px; font-family: var(--font-mono);">{{ total.earn }}</span><span style="padding: 0 12px; font-family: var(--font-mono);">1.00</span></div>
    </div></div>
  </section>

  <dc-import name="SymbolIndex" page="Market Watch" hint-size="100%,120px"></dc-import>
</main>
<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.UFT, sort: { k: 'name', d: 1 } };
  componentDidMount() { if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50); }
  componentWillUnmount() { clearInterval(this.p); }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const st = this.state; const { fmt } = U; const IN = U.fmtIN; const T = U.pe.total;
    const COLS = [['name', 'Sector', 'left'], ['pe', 'PE', 'right'], ['wpe', 'Weighted PE', 'right'], ['mcap', 'Market capital (mn)', 'right'], ['earn', 'Annualized earning (mn)', 'right'], ['weight', 'Total market capital weight', 'left']];
    const list = U.pe.sectors.slice().sort((a, b) => { const x = a[st.sort.k], y = b[st.sort.k]; const c = typeof x === 'string' ? x.localeCompare(y) : x - y; return c * st.sort.d; });
    const maxW = Math.max(...list.map(g => g.weight)) || 1;
    const heads = COLS.map(([k, label, align]) => ({ label, align, arrow: st.sort.k === k ? (st.sort.d === 1 ? '▲' : '▼') : '', onClick: () => this.setState(s => ({ sort: { k, d: s.sort.k === k ? -s.sort.d : (k === 'name' ? 1 : -1) } })) }));
    const rows = list.map((g, i) => ({ name: g.name, href: U.href('Sector PE Ratio'), zebra: i % 2 ? 'var(--neutral-50)' : 'transparent', pe: fmt(g.pe), wpe: fmt(g.wpe), mcap: IN(g.mcap), earn: IN(g.earn), earnColor: g.earn < 0 ? 'var(--red-700)' : 'var(--ink)', weight: fmt(g.weight, 2), barW: (g.weight / maxW * 100) + '%' }));
    return { heads, rows, total: { pe: fmt(T.pe), wpe: fmt(T.wpe), mcap: IN(T.mcap), earn: IN(T.earn) } };
  }
}
</script>
</body>
</html>
