<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/base-ui-custom-design-system-2d907855-cead-4505-91ed-cb7b719e8388/styles.css">
<script src="uftcl-data.js"></script>
<style>
.gc-sel { font: inherit; font-size: 13px; font-weight: 700; height: 34px; width: 100%; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.gc-act { font: inherit; font-size: 12px; font-weight: 700; height: 32px; padding: 0 6px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; }
.gc-act:hover { background: var(--ink); color: var(--paper); }
</style>
</helmet>
<article data-screen-label="Gallery chart" style="border: 1px solid var(--neutral-300); background: var(--paper); display: flex; flex-direction: column; min-width: 0; font-family: var(--font-sans);">
  <sc-if value="{{ hasPick }}"><div style="padding: 10px 10px 0;"><select class="gc-sel" aria-label="Instrument" value="{{ code }}" onChange="{{ onPick }}"><option value="">Select instrument</option><sc-for list="{{ opts }}" as="o" hint-placeholder-count="8"><option value="{{ o }}">{{ o }}</option></sc-for></select></div></sc-if>
  <sc-if value="{{ empty }}"><div style="height: 330px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; text-align: center; padding: 16px;">Choose an instrument above to see its chart.</div></sc-if>
  <sc-if value="{{ has }}">
    <div style="padding: 10px 10px 4px; display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px;"><b style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em;">{{ title }}</b><span style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);">{{ dateLabel }}</span></div>
      <div style="display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0 10px; min-height: 30px; font-family: var(--font-mono); font-size: 11px; line-height: 15px;"><span style="color: var(--text-muted);">O <b style="color: {{ cc }};">{{ o }}</b></span><span style="color: var(--text-muted);">H <b style="color: {{ cc }};">{{ h }}</b></span><span style="color: var(--text-muted);">L <b style="color: {{ cc }};">{{ l }}</b></span><span style="color: var(--text-muted);">C <b style="color: {{ cc }};">{{ c }}</b></span><span style="color: var(--text-muted);">V <b style="color: var(--ink);">{{ v }}</b></span><span style="color: var(--text-muted);">Chg <b style="color: {{ cc }};">{{ chg }}</b></span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 0 10px; font-family: var(--font-mono); font-size: 11px; min-height: 15px;"><sc-for list="{{ legend }}" as="g" hint-placeholder-count="2"><span style="color: {{ g.col }};">{{ g.label }} {{ g.v }}</span></sc-for></div>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 54px; height: 230px; position: relative;">
      <div style="position: relative; min-width: 0; border-top: 1px solid var(--neutral-300); border-bottom: 1px solid var(--neutral-300);">
        <svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" role="img" aria-label="{{ title }} price chart">
          <sc-for list="{{ grid }}" as="g" hint-placeholder-count="5"><line x1="0" x2="1000" y1="{{ g.y }}" y2="{{ g.y }}" stroke="var(--neutral-200)" stroke-width="1" vector-effect="non-scaling-stroke"></line></sc-for>
          <sc-for list="{{ vols }}" as="v" hint-placeholder-count="60"><rect x="{{ v.x }}" y="{{ v.y }}" width="{{ v.w }}" height="{{ v.h }}" fill="{{ v.col }}" opacity="0.4"></rect></sc-for>
          <sc-for list="{{ candles }}" as="k" hint-placeholder-count="60"><line x1="{{ k.cx }}" x2="{{ k.cx }}" y1="{{ k.hy }}" y2="{{ k.ly }}" stroke="{{ k.col }}" stroke-width="1" vector-effect="non-scaling-stroke"></line><rect x="{{ k.x }}" y="{{ k.y }}" width="{{ k.w }}" height="{{ k.h }}" fill="{{ k.col }}"></rect></sc-for>
          <path d="{{ linePath }}" fill="none" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
          <sc-for list="{{ overlays }}" as="p" hint-placeholder-count="2"><path d="{{ p.d }}" fill="none" stroke="{{ p.col }}" stroke-width="1.2" vector-effect="non-scaling-stroke"></path></sc-for>
          <line x1="0" x2="1000" y1="{{ lastY }}" y2="{{ lastY }}" stroke="{{ cc }}" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></line>
        </svg>
        <div style="position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--font-sans-b); font-size: 26px; letter-spacing: 0.08em; color: var(--neutral-200); opacity: 0.6; pointer-events: none;" aria-hidden="true">UFTCL</div>
        <span style="position: absolute; left: 4px; bottom: 2px; background: hsl(55deg 95% 62%); color: #000; font-family: var(--font-mono); font-size: 10px; padding: 0 3px; line-height: 14px;">{{ volUnit }}</span>
      </div>
      <div style="position: relative; border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);">
        <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="5"><span style="position: absolute; left: 5px; top: {{ t.top }}; transform: translateY(-50%);">{{ t.label }}</span></sc-for>
        <span style="position: absolute; left: 0; right: 0; top: {{ lastTop }}; transform: translateY(-50%); background: {{ cc }}; color: #fff; padding: 1px 4px; font-weight: 700;">{{ lastLabel }}</span>
      </div>
    </div>
    <sc-if value="{{ macdOn }}"><div style="display: grid; grid-template-columns: minmax(0, 1fr) 54px; height: 78px; position: relative;">
      <div style="position: relative; min-width: 0; border-bottom: 1px solid var(--neutral-300);">
        <svg viewBox="0 0 1000 80" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" role="img" aria-label="MACD">
          <line x1="0" x2="1000" y1="{{ mZero }}" y2="{{ mZero }}" stroke="var(--neutral-400)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
          <sc-for list="{{ hist }}" as="b" hint-placeholder-count="60"><rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" fill="{{ b.col }}"></rect></sc-for>
          <path d="{{ macdLine }}" fill="none" stroke="oklch(52% 0.17 262)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
          <path d="{{ sigLine }}" fill="none" stroke="oklch(70% 0.17 60)" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
        </svg>
        <div style="position: absolute; left: 4px; top: 2px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);">MACD(12,26,9) <span style="color: oklch(52% 0.17 262);">DIFF {{ mDiff }}</span> <span style="color: oklch(70% 0.17 60);">DEA {{ mDea }}</span></div>
      </div>
      <div style="border-left: 1px solid var(--neutral-300); font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); position: relative;"><span style="position: absolute; left: 5px; top: {{ mZeroPct }}; transform: translateY(-50%);">0.00</span></div>
    </div></sc-if>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 54px; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);"><div style="display: flex; justify-content: space-between; padding: 3px 6px;"><sc-for list="{{ xl }}" as="x" hint-placeholder-count="4"><span>{{ x }}</span></sc-for></div><span></span></div>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 10px 10px;"><sc-for list="{{ acts }}" as="a" hint-placeholder-count="5"><a class="gc-act" href="{{ a.href }}">{{ a.label }}</a></sc-for></div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:620},&quot;sector&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;code&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DSEX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tf&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;D&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pick&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;follow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;skey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const GKEY = 'uftcl.gal';
const DEF = { range: '3M', type: 'candle', ema: true, ma: true, macd: true, sym: 'DSEX' };
const UPC = 'oklch(52.7% 0.154 150.069)', DNC = 'oklch(50.5% 0.213 27.518)';
const ema = (a, n) => { const k = 2 / (n + 1); let e = a[0]; return a.map((v, i) => (e = i ? v * k + e * (1 - k) : v)); };
const sma = (a, n) => a.map((_, i) => i < n - 1 ? NaN : a.slice(i - n + 1, i + 1).reduce((s, x) => s + x, 0) / n);
const load = () => { try { return { ...DEF, ...(JSON.parse(localStorage.getItem(GKEY) || 'null') || {}) }; } catch (e) { return { ...DEF }; } };
class Component extends DCLogic {
  state = { ready: !!window.UFT, set: null, code: null };
  componentDidMount() {
    this.setState({ set: load() }); this.h = e => this.setState({ set: { ...load(), ...(e.detail || {}) } }); window.addEventListener('uft-gallery', this.h);
    if (this.props.pick) { try { const c = localStorage.getItem('uftcl.galpick.' + (this.props.skey || 'x')); if (c !== null) this.setState({ code: c }); } catch (e) { /* ignore */ } }
    if (!this.state.ready) this.p = setInterval(() => { if (window.UFT) { clearInterval(this.p); this.setState({ ready: true }); } }, 50);
  }
  componentWillUnmount() { clearInterval(this.p); window.removeEventListener('uft-gallery', this.h); }
  bars(U, kind, key, tf) {
    this._c = this._c || {}; const ck = kind + key + tf; if (this._c[ck]) return this._c[ck];
    let out = [];
    if (kind === 'sector') {
      const m = U.stocks.filter(s => s.sector === key).slice(0, 12); const per = m.map(s => U.chartBars(s.code, tf)); const n = Math.min(...per.map(b => b.length)); if (!n) return [];
      const base = per.map(b => b[b.length - n].c); const avg = f => i => per.reduce((a, b, j) => a + f(b[b.length - n + i]) / base[j] * 100, 0) / per.length;
      const o = avg(x => x.o), h = avg(x => x.h), l = avg(x => x.l), c = avg(x => x.c), v = i => per.reduce((a, b) => a + b[b.length - n + i].v, 0);
      for (let i = 0; i < n; i++) out.push({ o: o(i), h: h(i), l: l(i), c: c(i), v: v(i), t: per[0][per[0].length - n + i].t });
    } else if (['5m', '15m', '30m', '1h', '4h'].includes(tf)) {
      const D = U.chartBars(key, 'D'); if (!D.length) return []; const last = D[D.length - 1]; const r = U.rng(U.hash(key + tf)); const vol = { '5m': 0.0012, '15m': 0.0022, '30m': 0.003, '1h': 0.0045, '4h': 0.009 }[tf]; const mins = { '5m': 5, '15m': 15, '30m': 30, '1h': 60, '4h': 240 }[tf]; const n = 160;
      const cl = new Array(n); cl[n - 1] = last.c; for (let i = n - 1; i > 0; i--) cl[i - 1] = cl[i] / (1 + (r() - 0.5) * 2 * vol);
      const end = Date.UTC(2026, 10, 11, 8, 10); const fm = ms => { const d = new Date(ms + 6 * 36e5); return String(d.getUTCDate()).padStart(2, '0') + '-' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
      out = cl.map((c, i) => { const o = i ? cl[i - 1] : c; return { o, c, h: Math.max(o, c) * (1 + vol * 0.3 * r()), l: Math.min(o, c) * (1 - vol * 0.3 * r()), v: Math.round(last.v / 10 * (0.3 + r() * 1.4)), t: fm(end - (n - 1 - i) * mins * 6e4) }; });
    } else out = U.chartBars(key, tf);
    return (this._c[ck] = out);
  }
  renderVals() {
    const U = window.UFT; if (!U) return {};
    const P = this.props; const st = this.state; const S = st.set || DEF; const sector = P.sector || ''; const pick = !!P.pick; const follow = !!P.follow;
    const code = sector ? '' : follow ? S.sym : pick ? (st.code !== null ? st.code : P.code || '') : P.code || '';
    const tf = P.tf || 'D'; const hasData = sector ? U.sectors.some(s => s.name === sector) : !!(code && (U.bySym[code] || U.indices[code]));
    const opts = [...Object.keys(U.indices), ...U.symbols];
    const out = { hasPick: pick, code, opts, onPick: e => { const c = e.target.value; this.setState({ code: c }); try { localStorage.setItem('uftcl.galpick.' + (P.skey || 'x'), c); } catch (er) { /* ignore */ } }, empty: !hasData && pick, has: hasData };
    if (!hasData) return out;
    const all = this.bars(U, sector ? 'sector' : 'sym', sector || code, tf); if (all.length < 2) return { ...out, has: false, empty: pick };
    const nMap = { D: { '3M': 65, '6M': 130, '1Y': 250 }, W: { '3M': 26, '6M': 52, '1Y': 104 }, M: { '3M': 12, '6M': 24, '1Y': 48 } }; const n = Math.min(all.length, (nMap[tf] || { '3M': 60, '6M': 90, '1Y': 120 })[S.range] || 65);
    const closes = all.map(b => b.c); const e50 = ema(closes, 50), m20 = sma(closes, 20); const e12 = ema(closes, 12), e26 = ema(closes, 26); const macd = e12.map((v, i) => v - e26[i]); const sig = ema(macd, 9); const hist = macd.map((v, i) => v - sig[i]);
    const off = all.length - n; const bars = all.slice(off); const sl = a => a.slice(off); const e50s = sl(e50), m20s = sl(m20), ms = sl(macd), ss = sl(sig), hs = sl(hist);
    const last = bars[n - 1], prev = all[all.length - 2]; const chg = last.c - prev.c; const up = chg >= 0; const cc = up ? UPC : DNC;
    const lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h)); const pad = (hi - lo || 1) * 0.08; const mn = lo - pad, mx = hi + pad; const H = 300;
    const y = v => H * (1 - (v - mn) / (mx - mn)); const w = 1000 / n; const x = i => (i + 0.5) * w;
    const maxV = Math.max(...bars.map(b => b.v)) || 1; const vh = H * 0.2;
    const fd = (v, d) => U.fmt(v, d); const dp = last.c < 20 ? 2 : last.c < 1000 ? 2 : 1;
    const lineOfY = (a, fy) => { let d = '', pen = false; a.forEach((v, i) => { if (isNaN(v)) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + fy(v).toFixed(1); pen = true; }); return d; };
    const lineOf = a => lineOfY(a, y);
    const ticks = [0, 1, 2, 3, 4, 5].map(i => { const v = mn + (mx - mn) * i / 5; return { top: (y(v) / H * 100).toFixed(1) + '%', label: fd(v, dp), y: y(v) }; });
    const vmag = maxV >= 1e9 ? ['x1B', 1e9] : maxV >= 1e7 ? ['x10M', 1e7] : maxV >= 1e6 ? ['x1M', 1e6] : maxV >= 1e4 ? ['x10K', 1e4] : ['x1K', 1e3];
    const mAbs = Math.max(...ms.map(Math.abs), ...ss.map(Math.abs), ...hs.map(Math.abs), 1e-9); const MH = 80; const my = v => MH / 2 - (v / mAbs) * (MH / 2 - 8);
    const idxs = [0, Math.floor(n / 3), Math.floor(n * 2 / 3), n - 1];
    const A = sector ? { chart: 'Sector Share Price', vpa: 'VPA', arch: 'VPA Archive', depth: 'Depth Monitor', news: 'News Effect Chart' } : null; const act = sector ? null : U.actions(code);
    const links = sector ? [['Chart', U.href(A.chart)], ['VPA M.', U.href(A.vpa)], ['VPA A.', U.href(A.arch)], ['Depth', U.href(A.depth)], ['News', U.href(A.news)]] : [['Chart', act.chart], ['VPA M.', act.vpa], ['VPA A.', act.archive], ['Depth', act.depth], ['News', act.effect]];
    return { ...out, title: sector || code, dateLabel: last.t, cc, o: fd(last.o, dp), h: fd(last.h, dp), l: fd(last.l, dp), c: fd(last.c, dp), v: U.fmtInt(last.v), chg: fd(chg, 2) + '(' + (chg >= 0 ? '+' : '') + fd(chg / prev.c * 100, 2) + '%)',
      legend: [S.ema ? { col: 'oklch(55% 0.2 22)', label: 'EMA(50)', v: fd(e50s[n - 1], dp) } : null, S.ma ? { col: 'oklch(52.7% 0.154 150)', label: 'MA(20)', v: isNaN(m20s[n - 1]) ? '-' : fd(m20s[n - 1], dp) } : null].filter(Boolean),
      grid: ticks.map(t => ({ y: t.y })), ticks, vols: bars.map((b, i) => ({ x: (i * w + w * 0.15).toFixed(1), y: (H - (b.v / maxV) * vh).toFixed(1), w: (w * 0.7).toFixed(1), h: ((b.v / maxV) * vh).toFixed(1), col: b.c >= b.o ? UPC : DNC })), volUnit: vmag[0],
      candles: S.type === 'candle' ? bars.map((b, i) => { const col = b.c >= b.o ? UPC : DNC; const yo = y(b.o), yc = y(b.c); return { cx: x(i).toFixed(1), x: (i * w + w * 0.18).toFixed(1), w: Math.max(w * 0.64, 0.8).toFixed(1), y: Math.min(yo, yc).toFixed(1), h: Math.max(Math.abs(yo - yc), 0.8).toFixed(1), hy: y(b.h).toFixed(1), ly: y(b.l).toFixed(1), col }; }) : [],
      linePath: S.type === 'line' ? lineOf(bars.map(b => b.c)) : '', overlays: [S.ema ? { d: lineOf(e50s), col: 'oklch(55% 0.2 22)' } : null, S.ma ? { d: lineOf(m20s), col: 'oklch(52.7% 0.154 150)' } : null].filter(Boolean),
      lastY: y(last.c), lastTop: (y(last.c) / H * 100).toFixed(1) + '%', lastLabel: fd(last.c, dp),
      macdOn: !!S.macd, mZero: my(0), mZeroPct: (my(0) / MH * 100).toFixed(1) + '%', hist: hs.map((v, i) => ({ x: (i * w + w * 0.2).toFixed(1), y: Math.min(my(0), my(v)).toFixed(1), w: (w * 0.6).toFixed(1), h: Math.max(Math.abs(my(v) - my(0)), 0.5).toFixed(1), col: v >= 0 ? UPC : DNC })), macdLine: lineOfY(ms, my), sigLine: lineOfY(ss, my), mDiff: fd(ms[n - 1], 2), mDea: fd(ss[n - 1], 2),
      xl: idxs.map(i => bars[i].t.replace(/-\d{2}$/, '')), acts: links.map(([label, href]) => ({ label, href }))
    };
  }
}
</script>
</body>
</html>
